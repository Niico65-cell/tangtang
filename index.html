/* 把 ids 放到桌上：target = 'new'（新組合）或 某一組的 index */
function moveIds(ids,target){
  const set=new Set(ids);
  S.rack=S.rack.filter(id=>!set.has(id));
  S.table=S.table.map(s=>s.filter(id=>!set.has(id)));
  if(target==='new')S.table.push(ids.slice());
  else if(S.table[target])S.table[target]=S.table[target].concat(ids);
  else S.table.push(ids.slice());
  S.table=S.table.filter(s=>s.length).map(tidy);
  S.sel=new Set();sfx('place');
}
/* 把 ids 放回手牌，插在 before 那張牌前面（沒指定就放最後）*/
function placeInRack(ids,before){
  const set=new Set(ids);
  S.table=S.table.map(s=>s.filter(id=>!set.has(id))).filter(s=>s.length).map(tidy);
  S.rack=S.rack.filter(id=>!set.has(id));
  let i=before==null?S.rack.length:S.rack.indexOf(before);if(i<0)i=S.rack.length;
  S.rack.splice(i,0,...ids);
  S.sel=new Set();sfx('place');
}
function moveSel(target){
  if(!S.sel.size){toast(tr('selFirst'));return}
  let ids=[...S.sel];
  if(target==='rack'){
    const ok=ids.filter(id=>S.startRackSet.has(id)||S.rack.includes(id));
    if(ok.length<ids.length)toast(tr('noRecall'));
    ids=ok;if(!ids.length)return;
    placeInRack(ids,null);sortRack(S.rack,S.sortMode);
  }else moveIds(ids,target);
  render();
}
function undo(){S.table=clone(S.startTable);S.rack=S.startRackArr.slice();S.sel=new Set();render()}
function hint(){
  const hm=hintMax();if(hm===0)return;
  const paid=hintPaid();   /* 同一回合已扣過，再按不再扣 */
  if(hm>0&&!paid&&S.hintLeft<=0){toast(tr('hintNone'));return}
  const me=S.st.players[myIdx()];
  const plan=planBot(S.startTable,S.startRackArr,me.meld,S.st.settings.meld30,'hard');
  if(!plan.played){toast(tr('noHint'));return}
  S.table=plan.table;S.rack=sortRack(plan.rack,S.sortMode);S.sel=new Set();
  if(hm>0&&!paid){S.hintLeft--;S.hintSeq=S.turnSeq;S.hintGid=S.gid}
  toast(tr('hinted',plan.played));render();
}
async function endTurn(){
  if(S.tutM){tutEnd();return}
  if(!isMyTurn()||S.busy)return;
  const played=playedCount();
  if(played===0){
    S.busy=true;
    const ok=await finishTurn(S.me.id,S.startTable,S.startRackArr,0);
    S.busy=false;
    if(ok)await afterWrite();else{toast(tr('syncRetry'));render()}
    return;
  }
  const badIdx=S.table.findIndex(s=>!analyze(s).ok);
  if(badIdx>=0){
    toast(tr('badSets'));sfx('bad');
    document.querySelectorAll('.plate.bad').forEach(el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')});
    return;
  }
  const me=S.st.players[myIdx()];
  if(!me.meld){
    const mi=meldInfo();
    if(!mi.ok){toast(tr('meldNoTouch'));sfx('bad');return}
    if(S.st.settings.meld30&&mi.pts<30){toast(tr('meld30Need',mi.pts));sfx('bad');return}
  }
  S.busy=true;
  const ok=await finishTurn(S.me.id,S.table.map(s=>analyze(s).order),S.rack,played);
  S.busy=false;
  if(ok)await afterWrite();else{toast(tr('syncRetry'));render()}
}
async function timeUp(){
  toast(tr('timeUp'));
  S.busy=true;
  const ok=await finishTurn(S.me.id,S.startTable,S.startRackArr,0);
  S.busy=false;
  if(ok)await afterWrite();
}
function tick(){
  const now=Date.now(),dt=S.lastTick?now-S.lastTick:0;S.lastTick=now;
  const el=$('#timer');if(!el||!S.st||S.st.phase!=='play')return;
  const w=$('#clockwrap');
  if(!S.deadline){el.textContent='∞';if(w){w.classList.add('nolimit');w.classList.remove('hurry')}return}
  const r=Math.ceil((S.deadline-now)/1000),tm=(S.st.settings.timer||1)*1000;
  el.textContent=Math.max(0,r);
  if(w){w.classList.remove('nolimit');w.style.setProperty('--p',Math.max(0,Math.min(100,(S.deadline-now)/tm*100)));w.classList.toggle('hurry',r<=10&&r>0)}
  if(r<=0&&isMyTurn()&&S.timeoutSeq!==S.turnSeq&&!S.busy){S.timeoutSeq=S.turnSeq;timeUp()}
}
setInterval(tick,250);

/* ====== 拖曳 ====== */
const DR={on:false,act:false,id:0,ids:[],from:'',x0:0,y0:0,pid:null,tl:null,ghost:null,tgt:null};
function dragStart(){
  const my=isMyTurn();
  let ids=(S.sel.has(DR.id)&&S.sel.size>1&&my)?[...S.sel]:[DR.id];
  if(!my)ids=[DR.id];
  DR.ids=ids;DR.act=true;
  const r=DR.tl.getBoundingClientRect();
  const g=document.createElement('div');g.className='dragghost';
  g.style.setProperty('--tw',r.width+'px');g.style.setProperty('--th',r.height+'px');
  g.innerHTML=`<div class="gt">${ids.slice(0,3).map(tileMini).join('')}</div>${ids.length>1?`<span class="badge">${ids.length}</span>`:''}`;
  document.body.appendChild(g);DR.ghost=g;DR.gw=r.width;DR.gh=r.height;
  DR.tl.classList.add('dragsrc');
}
function dragMove(x,y){
  if(DR.ghost)DR.ghost.style.transform=`translate(${x-DR.gw/2}px,${y-DR.gh*.75}px)`;
  document.querySelectorAll('.drop').forEach(e=>e.classList.remove('drop'));
  DR.tgt=null;
  const el=document.elementFromPoint(x,y);if(!el)return;
  const my=isMyTurn();
  const plate=el.closest('.plate');
  if(plate&&my){
    const i=[...document.querySelectorAll('#table .plate')].indexOf(plate);
    DR.tgt={k:'plate',i};plate.classList.add('drop');return;
  }
  if(el.closest('#rack')||el.closest('.dock')){
    const rk=$('#rack');DR.tgt={k:'rack',before:rackBefore(x,y)};if(rk)rk.classList.add('drop');return;
  }
  if(el.closest('#table')&&my){DR.tgt={k:'new'};$('#table').classList.add('drop')}
}
function rackBefore(x,y){
  const ts=[...document.querySelectorAll('#rack .tile')].filter(t=>!DR.ids.includes(+t.dataset.t));
  if(!ts.length)return null;
  let best=null,bd=1e9;
  for(const t of ts){
    const r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(x-cx,(y-cy)*1.6);
    if(d<bd){bd=d;best={t,after:x>cx}}
  }
  const i=ts.indexOf(best.t)+(best.after?1:0);
  return i<ts.length?+ts[i].dataset.t:null;
}
function dragEnd(commit){
  if(DR.ghost){DR.ghost.remove();DR.ghost=null}
  document.querySelectorAll('.drop,.dragsrc').forEach(e=>e.classList.remove('drop','dragsrc'));
  const was=DR.act,tgt=DR.tgt,ids=DR.ids.slice();
  DR.on=false;DR.act=false;DR.tgt=null;
  if(!was)return;
  S.suppressClick=1;
  if(commit&&tgt){
    if(tgt.k==='rack'){
      const fromTable=ids.filter(id=>!S.rack.includes(id));
      let okIds=ids;
      if(fromTable.length){
        if(!isMyTurn()){S.pendingRender=true}
        else{
          const bad=fromTable.filter(id=>!S.startRackSet.has(id));
          if(bad.length){toast(tr('noRecall'));okIds=ids.filter(id=>!bad.includes(id))}
        }
      }
      if(okIds.length&&(isMyTurn()||!fromTable.length))placeInRack(okIds,tgt.before);
    }else if(isMyTurn())moveIds(ids,tgt.k==='plate'?tgt.i:'new');
  }
  render();
}
document.addEventListener('pointerdown',e=>{
  S.suppressClick=0;
  if(e.button>0||S.screen!=='game'||S.modal||!S.st||S.st.phase!=='play')return;
  const tl=e.target.closest&&e.target.closest('.tile[data-t]');if(!tl)return;
  const from=tl.closest('#rack')?'rack':tl.closest('#table')?'table':'';if(!from)return;
  if(from==='table'&&!isMyTurn())return;
  DR.on=true;DR.act=false;DR.id=+tl.dataset.t;DR.from=from;DR.x0=e.clientX;DR.y0=e.clientY;DR.pid=e.pointerId;DR.tl=tl;
});
document.addEventListener('pointermove',e=>{
  if(!DR.on||e.pointerId!==DR.pid)return;
  if(!DR.act){if(Math.hypot(e.clientX-DR.x0,e.clientY-DR.y0)<8)return;dragStart()}
  dragMove(e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{if(DR.on&&e.pointerId===DR.pid)dragEnd(true)});
document.addEventListener('pointercancel',e=>{if(DR.on&&e.pointerId===DR.pid)dragEnd(false)});

/* ====== 對話框 ====== */
const exT=(n,c)=>`<span class="tile c${c}"><b>${n}</b><i>${TH().suits[c]}</i></span>`;
const exJ=()=>`<span class="tile jk"><b>${TH().joker}</b><i>${esc(tr('jokerTag'))}</i></span>`;
const mk=ok=>`<span class="mark ${ok?'ok':'no'}">${ok?'✓':'✕'}</span>`;
const sep=t=>`<span class="sep">${t}</span>`;
function rulesH(){
  const blk=(t,d,rows)=>`<div class="rvb"><h4>${tr(t)}</h4>${rows.map(r=>`<div class="ex">${r}</div>`).join('')}<p>${tr(d)}</p></div>`;
  return `<div class="modal" data-act="closem"><div class="sheet">
    <h3>${IC('rules')}${tr('rulesTitle')}</h3>
    <p class="note" style="text-align:left;margin:0 0 10px">${tr('rvGoal')}</p>
    <div class="rv">
      ${blk('rvRunT','rvRun',[exT(4,1)+exT(5,1)+exT(6,1)+mk(1)])}
      ${blk('rvGrpT','rvGrp',[exT(7,0)+exT(7,1)+exT(7,3)+mk(1)])}
      ${blk('rvJokT','rvJok',[exT(3,2)+exJ()+exT(5,2)+mk(1)])}
      ${blk('rvMeldT','rvMeld',[exT(10,0)+exT(11,0)+exT(12,0)+sep('= 33')+mk(1)])}
      ${blk('rvAddT','rvAdd',[exT(3,3)+exT(4,3)+exT(5,3)+sep('＋')+exT(6,3),sep('→')+exT(3,3)+exT(4,3)+exT(5,3)+exT(6,3)+mk(1)])}
      ${blk('rvBadT','rvBad',[exT(4,1)+exT(5,1)+exT(7,1)+mk(0),exT(7,0)+exT(7,0)+exT(7,1)+mk(0)])}
      <div class="rvb"><h4>${tr('rvOpT')}</h4><p style="margin:0">${tr('rvOp')}</p></div>
    </div>
    <ul>${tr('rulesList').map(x=>`<li>${x}</li>`).join('')}</ul>
    <button class="btn" data-act="closem">${tr('gotIt')}</button></div></div>`;
}
function menuH(){
  const st=S.st;
  const cur=st&&st.phase==='play'?st.players[st.turn]:null;
  const other=cur&&!isMyTurn()&&!cur.bot&&!cur.auto;
  return `<div class="modal" data-act="closem"><div class="sheet">
    <h3>${tr('menuTitle')}</h3>
    ${settingsH()}
    <button class="btn ghost" data-act="rules">${tr('rules')}</button>
    ${S.host&&other?`<button class="btn alt" data-act="skip">${tr('skipOther')}</button><button class="btn ghost" data-act="kick">${tr('kick')}</button>`:''}
    <button class="btn" data-act="leave">${tr('leaveGame')}</button>
    <button class="btn ghost" data-act="closem">${tr('keepPlaying')}</button></div></div>`;
}
function profileH(){
  const sg=S.stats,o=sg.online||{g:0,w:0},s=sg.solo||{g:0,w:0};
  return `<div class="modal" data-act="closem"><div class="sheet">
    <h3>${tr('editProfile')}</h3>
    <label class="lab" for="pname">${tr('nick')}</label>
    <input id="pname" maxlength="8" value="${esc(S.me.name)}" placeholder="${esc(tr('nickPh'))}" autocomplete="off">
    <label class="lab">${tr('pickAv')}</label>${avGridH()}
    <h3 style="margin-top:18px;font-size:16px">${tr('statsT')}</h3>
    <div class="stats"><div><b>${sg.g}</b><small>${tr('sGames')}</small></div><div><b>${sg.w}</b><small>${tr('sWins')}</small></div><div><b>${winRate(sg)}%</b><small>${tr('sRate')}</small></div><div><b>${sg.streak}</b><small>${tr('sStreak')}</small></div></div>
    <p class="note" style="margin:6px 0 0">${tr('sBest')} ${sg.best} · ${tr('sSolo')} ${s.w||0}/${s.g||0} · ${tr('sOnline')} ${o.w||0}/${o.g||0}</p>
    <p class="note" style="margin:2px 0 0">${tr('sNote')}</p>
    <button class="btn" data-act="saveprofile">${tr('save')}</button></div></div>`;
}
function nameH(){
  return `<div class="modal"><div class="sheet nm">
    <div class="nmav">${avH(S.me.av)}</div>
    <h3>${tr('nameT')}</h3>
    <p class="note" style="margin:0 0 10px">${tr('nameAsk')}</p>
    <input id="nname" maxlength="8" value="${esc(S.me.name)}" autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="confirmname" style="margin-top:14px">${tr('nameOk')}</button></div></div>`;
}
function openModal(kind){
  S.modal=kind;
  $('#modal').innerHTML=kind==='rules'?rulesH():kind==='menu'?menuH():kind==='profile'?profileH():kind==='name'?nameH():'';
}
function inviteLink(){
  try{if(/^https?:$/.test(location.protocol))return location.href.split(/[?#]/)[0]+'?room='+S.code}catch(e){}
  return '';
}
function inviteText(){
  const l=inviteLink();
  return tr('inviteText',S.code)+(l?'\n'+l:'')+(NET.pw?'\n'+tr('inviteHasPw'):'');
}
async function copyInvite(share){
  const text=inviteText();
  if(share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast(tr('inviteCopied'));return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(tr('inviteCopied'))}
  catch(e){toast(tr('codeIs',S.code),4000)}
}
function prefsChanged(){
  applyPrefs();savePrefs();
  const keepSel=document.activeElement&&document.activeElement.id;
  render();
  if(S.modal)openModal(S.modal);
  if(keepSel){const e=document.getElementById(keepSel);if(e)e.focus()}
}

/* ====== 事件 ====== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-t]');if(!el)return;
  if(el.dataset.t!==undefined&&!el.dataset.act){
    if(S.suppressClick){S.suppressClick=0;return}
    onTile(+el.dataset.t);return;
  }
  const act=el.dataset.act,v=el.dataset.v;
  if(!['newset','addto','end','rx','closem','mute','setsfx','hint'].includes(act))sfx('ui');
  if(act==='closem'&&el.classList.contains('modal')&&e.target!==el)return;
  switch(act){
    case'av':{const n=$('#pname');if(n&&S.modal==='profile')S.me.name=n.value;S.me.av=v;savePrefs();render();if(S.modal==='profile')openModal('profile');break}
    case'confirmname':{const n=$('#nname'),v2=n?n.value.trim().slice(0,8):'';if(v2)S.me.name=v2;S.needName=false;savePrefs();openModal(null);render();toast(tr('nameHi',S.me.name),1800);break}
    case'profile':openModal('profile');break;
    case'saveprofile':{const n=$('#pname');if(n)S.me.name=n.value.trim().slice(0,8);if(!S.me.name)ensureName();savePrefs();openModal(null);render();toast(tr('save')+' ✓',1400);break}
    case'sndtest':{audUnlock();const was=S.pref.sfx;S.pref.sfx=true;sfx('done');S.pref.sfx=was;setTimeout(()=>toast(audState()==='running'?tr('sndOk'):tr('sndHint'),5200),350);break}
    case'setsfx':S.pref.sfx=v==='1';prefsChanged();sfx('ui');break;
    case'settrack':if(v==='off')S.pref.music=false;else{S.pref.music=true;S.pref.track=v;musRestart()}prefsChanged();break;
    case'setmusic':S.pref.music=v==='1';prefsChanged();break;
    case'mute':{const on=!(S.pref.sfx||S.pref.music);S.pref.sfx=on;S.pref.music=on;prefsChanged();sfx('ui');break}
    case'setlang':S.pref.lang=v;prefsChanged();break;
    case'settheme':S.pref.theme=v;prefsChanged();break;
    case'settut':S.pref.tut=v==='1';if(S.pref.tut)S.tutDone=false;prefsChanged();break;
    case'tutnext':tutNextStep();break;
    case'tutprev':if(S.tutM&&S.tutM.step>0){S.tutM.step--;tutLoad();render()}break;
    case'tutskip':tutExit();S.screen='welcome';render();break;
    case'tutstart':startQuick();break;
    case'tutagain':S.tutM.step=0;tutLoad();render();break;
    case'learn':startTutorial(v||'welcome');break;
    case'quick':startQuick();break;
    case'custom':S.screen='custom';render();break;
    case'cstart':startCustom();break;
    case'setseat':{const [i,val]=v.split(':'),n=+i;S.cfg.seats[n]=val;if(S.cfg.seats.every(x=>x==='off')){S.cfg.seats[n]='bot';toast(tr('need2'))}savePrefs();render();break}
    case'cdiff':S.cfg.diff=v;savePrefs();render();break;
    case'ctimer':S.cfg.timer=+v;savePrefs();render();break;
    case'chints':S.cfg.hints=+v;savePrefs();render();break;
    case'cmeld':S.cfg.meld30=v==='1';savePrefs();render();break;
    case'go':S.screen=v;render();break;
    case'gosettings':S.prev=S.screen;S.screen='settings';render();break;
    case'backs':S.screen=S.prev||'welcome';render();break;
    case'create':ensureRemote().then(ok=>ok?createRoom(true):noRemote());break;
    case'rejoin':if(S.lastRoom){S.joinCode=S.lastRoom.code;S.joinPw=S.lastRoom.pw||'';ensureRemote().then(ok=>ok?joinRoom():noRemote())}break;
    case'join':ensureRemote().then(ok=>ok?joinRoom():noRemote());break;
    case'rules':openModal('rules');break;
    case'closem':{const n=$('#pname');if(n&&S.modal==='profile'){S.me.name=n.value.trim().slice(0,8);savePrefs()}openModal(null);render();break}
    case'menu':openModal('menu');break;
    case'copy':copyInvite(false);break;
    case'share':copyInvite(true);break;
    case'addbot':if(S.host&&S.st.players.length<((S.st.settings&&S.st.settings.cap)||4)){const n=clone(S.st);addBotTo(n);writeLobby(n)}break;
    case'rmbot':if(S.host){const n=clone(S.st);n.players=n.players.filter(p=>p.id!==v);writeLobby(n)}break;
    case'tset':if(S.host){const n=clone(S.st);n.settings.timer=+v;writeLobby(n)}break;
    case'mset':if(S.host){const n=clone(S.st);n.settings.meld30=v==='1';writeLobby(n)}break;
    case'dset':if(S.host){const n=clone(S.st);n.settings.diff=v;writeLobby(n)}break;
    case'start':startGame();break;
    case'again':playAgain();break;
    case'leave':openModal(null);leaveRoom();break;
    case'skip':openModal(null);forceSkip();break;
    case'kick':{openModal(null);if(S.st&&S.st.phase==='play'){const p=S.st.players[S.st.turn];if(p&&!p.bot&&!p.auto&&p.id!==S.me.id)removeFromGame(p.id)}break}
    case'react':S.rxOpen=!S.rxOpen;render();break;
    case'rx':sendReact(v);break;
    case'sort':S.sortMode=S.sortMode==='color'?'num':'color';sortRack(S.rack,S.sortMode);render();break;
    case'undo':undo();break;
    case'hint':hint();break;
    case'newset':moveSel('new');break;
    case'addto':moveSel(+v);break;
    case'back':moveSel('rack');break;
    case'clearsel':S.sel=new Set();render();break;
    case'end':endTurn();break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='name'||id==='pname')S.me.name=e.target.value;
  if(id==='nname')S.nameDraft=e.target.value;
  if(id==='code'){S.joinCode=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')}
  if(id==='jpw')S.joinPw=e.target.value;
  if(id==='hostpw')NET.pw=e.target.value.slice(0,8);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nname'){e.preventDefault();const b=document.querySelector('[data-act=confirmname]');if(b)b.click()}});
document.addEventListener('change',e=>{if(e.target.id==='name'||e.target.id==='pname')savePrefs()});

(async()=>{
  await loadProfile();
  try{
    const q=new URLSearchParams(location.search).get('room');
    if(q){S.joinCode=q.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);S.fromLink=true}
  }catch(e){}
  if(!S.me.name.trim()){S.me.name=tr('defNames')[Math.floor(Math.random()*4)];S.me.av='a'+Math.floor(Math.random()*AVN);S.needName=true}
  S.screen=S.fromLink?'join':'welcome';
  applyPrefs();
  render();
  if(S.needName)openModal('name');
  if(S.fromLink&&S.joinCode.length===4)toast(tr('fromLink',S.joinCode),3500);
  remoteOK=peerOK()||await probe();
  const ae=document.activeElement;
  if(['welcome','custom','join','settings'].includes(S.screen)&&!(ae&&ae.tagName==='INPUT'))render();
})();

})();
</script>
