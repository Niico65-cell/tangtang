<!DOCTYPE html>
<html lang="zh-Hant" data-theme="cute">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>糖糖拉密</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   拉密 Rummi — 主題變數系統
   所有元件只讀取下面的 token；兩種風格只是兩組 token + 少量結構差異
   ===================================================================== */
:root{
  /* ---- 台式可愛（預設）---- */
  --bg:#fdf0f5;
  --bg-img:
    radial-gradient(circle at 8% 4%,#ffd3e4 0,transparent 38%),
    radial-gradient(circle at 96% 14%,#dfe2ff 0,transparent 42%),
    radial-gradient(circle at 78% 100%,#ffe8c6 0,transparent 38%);
  --surface:#ffffff; --surface-2:#fff4f8; --line:#f0d2df; --line-strong:#e3b3c7;
  --ink:#43324d; --ink2:#665071; --ink-inv:#ffffff;
  --accent:#d6457a; --accent-d:#b03160; --accent-soft:#ffe2ed; --accent-ink:#ffffff;
  --alt:#5878e0; --alt-d:#3d58b8;
  --good:#12805a; --good-soft:#d8f3e6; --bad:#c42f4e; --bad-soft:#ffe0e7; --warn-soft:#fff0c9; --warn:#8a5a00;
  --c0:#d3382d; --c1:#6847dc; --c2:#b05f00; --c3:#12805a;
  --r-card:24px; --r-ctl:18px; --r-btn:999px; --r-tile:.3;
  --font:"Yuanti TC","Yuanti SC","Hiragino Maru Gothic ProN",ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:var(--font);
  --tile-bg:#fffdfb; --tile-edge:#ead7ec;
  --tile-shadow:0 3px 0 var(--tile-edge),0 7px 12px rgba(150,90,160,.16);
  --tile-sel:0 0 0 3px var(--accent),0 12px 16px rgba(214,69,122,.3);
  --card-shadow:0 10px 30px rgba(220,130,170,.16),inset 0 0 0 2px #fff;
  --btn-bg:linear-gradient(180deg,#ee6a98,#d6457a);
  --btn-shadow:0 4px 0 var(--accent-d);
  --felt:#fffafc;
  --felt-img:
    repeating-linear-gradient(0deg,rgba(255,132,170,.2) 0 20px,transparent 20px 40px),
    repeating-linear-gradient(90deg,rgba(255,132,170,.2) 0 20px,transparent 20px 40px);
  --felt-shadow:inset 0 0 0 4px #fff,0 10px 28px rgba(255,140,175,.22);
  --plate-ok:#8be0b9; --plate-bad:#ff9fb7;
  --modal-bg:rgba(67,50,77,.4);
  --dock-bg:rgba(255,255,255,.92);
  --av-line:#5a3d56;
  --tw:40px; --th:54px;
}
html[data-theme="ins"]{
  /* ---- 韓系極簡：冷灰藍底 × 純白卡片 × 單一藍色重點 × 深色牌桌（高對比）---- */
  --bg:#e9edf4;
  --bg-img:linear-gradient(180deg,#f5f7fb 0%,#e6ebf3 100%);
  --surface:#ffffff; --surface-2:#f3f5f9; --line:#d5dce8; --line-strong:#aab6c9;
  --ink:#0f172a; --ink2:#475569; --ink-inv:#ffffff;
  --accent:#2f5bff; --accent-d:#1b3fd0; --accent-soft:#e1e8ff; --accent-ink:#ffffff;
  --alt:#0f172a; --alt-d:#0f172a;
  --good:#0b7a4b; --good-soft:#d9f2e5; --bad:#c4243b; --bad-soft:#fde2e7; --warn-soft:#fdeebb; --warn:#7a5200;
  --c0:#d92d20; --c1:#1f4fd8; --c2:#0f172a; --c3:#0b8a5a;
  --r-card:16px; --r-ctl:11px; --r-btn:12px; --r-tile:.17;
  --font:"Inter","Pretendard","Helvetica Neue","Apple SD Gothic Neo","PingFang TC","Noto Sans TC","Noto Sans KR","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Inter","Pretendard","Helvetica Neue",system-ui,sans-serif;
  --tile-bg:#ffffff; --tile-edge:#c3ccdb;
  --tile-shadow:0 0 0 1px #cfd7e4,0 2px 0 var(--tile-edge),0 7px 12px rgba(6,14,40,.28);
  --tile-sel:0 0 0 3px var(--accent),0 12px 16px rgba(6,14,40,.35);
  --card-shadow:0 0 0 1px var(--line),0 8px 24px rgba(15,23,42,.07);
  --btn-bg:var(--accent);
  --btn-shadow:0 3px 0 var(--accent-d);
  --felt:#1d2a45;
  --felt-img:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.4px);
  --felt-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 4px 24px rgba(0,0,0,.35);
  --plate-ok:#4ade80; --plate-bad:#ff6b7a;
  --modal-bg:rgba(15,23,42,.55);
  --dock-bg:rgba(255,255,255,.97);
  --av-line:#0f172a;
}
html[data-theme="fun"]{
  /* ---- 活潑繽紛：藍頂欄 × 綠牌桌 × 黃手牌區 × 橘主按鈕 ---- */
  --bg:#e8f1ff;
  --bg-img:radial-gradient(circle at 0 0,#ffe9a8 0,transparent 38%),radial-gradient(circle at 100% 8%,#bfe0ff 0,transparent 42%),radial-gradient(circle at 80% 100%,#c9f2da 0,transparent 40%);
  --surface:#ffffff; --surface-2:#f3f7ff; --line:#cfdcf2; --line-strong:#9db6e0;
  --ink:#14213d; --ink2:#3f506e; --ink-inv:#ffffff;
  --accent:#e0500c; --accent-d:#b13a04; --accent-soft:#ffe6d3; --accent-ink:#ffffff;
  --alt:#2563eb; --alt-d:#1b4fc4;
  --good:#0b7f45; --good-soft:#d5f5e2; --bad:#d3233c; --bad-soft:#ffe0e5; --warn-soft:#fff0b0; --warn:#6e4a00;
  --c0:#dc2430; --c1:#1d5fe0; --c2:#e0a000; --c3:#1b1f2a;
  --r-card:20px; --r-ctl:14px; --r-btn:16px; --r-tile:.22;
  --font:"Nunito","Rubik","PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Noto Sans KR","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Nunito","Rubik","PingFang TC",system-ui,sans-serif;
  --tile-bg:#ffffff; --tile-edge:#b8c6dd;
  --tile-shadow:0 3px 0 var(--tile-edge),0 7px 11px rgba(0,40,20,.28);
  --tile-sel:0 0 0 3px #ffd43b,0 12px 16px rgba(0,40,20,.4);
  --card-shadow:0 8px 22px rgba(37,99,235,.14),inset 0 0 0 2px #fff;
  --btn-bg:linear-gradient(180deg,#f57a2a,#e0500c);
  --btn-shadow:0 4px 0 var(--accent-d);
  --felt:#1f8f5f;
  --felt-img:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.6px);
  --felt-shadow:inset 0 0 0 4px #166d48,0 8px 20px rgba(22,109,72,.35);
  --plate-ok:#ffd43b; --plate-bad:#ff5468;
  --modal-bg:rgba(20,33,61,.55);
  --dock-bg:rgba(255,243,196,.97);
  --av-line:#14213d;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg-img),var(--bg);background-attachment:fixed;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid #6c93ff;outline-offset:2px}
#app{height:100dvh;overflow-y:auto;overflow-x:hidden}

/* ---------- 牌 ---------- */
.tile{
  width:var(--tw);height:var(--th);border-radius:calc(var(--tw)*var(--r-tile));
  background:var(--tile-bg);color:var(--tc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:var(--tile-shadow);position:relative;flex:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s;
}
.tile b{font-family:var(--font-num);font-size:calc(var(--tw)*.56);line-height:1;font-weight:900}
.tile i{font-style:normal;font-size:calc(var(--tw)*.3);line-height:1}
.c0{--tc:var(--c0)}.c1{--tc:var(--c1)}.c2{--tc:var(--c2)}.c3{--tc:var(--c3)}
.tile.jk{background:linear-gradient(140deg,#ffe3df,#fff1c9 60%,#ffe9f1);--tc:#c22f26}
.tile.jk b{font-size:calc(var(--tw)*.5)}
.tile.jk i{font-size:calc(var(--tw)*.22);font-weight:800}
html[data-theme="ins"] .tile b{font-size:calc(var(--tw)*.64);font-weight:800}
html[data-theme="ins"] .tile i{font-family:system-ui,sans-serif;font-size:calc(var(--tw)*.26)}
html[data-theme="ins"] .tile.jk{background:linear-gradient(140deg,#2f5bff,#6a3df0);--tc:#ffffff}
html[data-theme="ins"] .tile.jk b{font-size:calc(var(--tw)*.5)}
html[data-theme="ins"] .tile.jk i{font-size:calc(var(--tw)*.18);letter-spacing:.05em;font-weight:700}
#rack .tile,#table .tile{touch-action:none;cursor:grab}
.tile:active{transform:scale(.95)}
.tile.sel{transform:translateY(-8px) rotate(-3deg) scale(1.06);box-shadow:var(--tile-sel)}
html[data-theme="ins"] .tile.sel{transform:translateY(-7px)}
.tile.fresh{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.tile.fresh::before{content:"✨";position:absolute;top:-9px;left:-6px;font-size:14px}
html[data-theme="ins"] .tile.fresh::before{content:"";top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--c0)}
.cloth .tile.mine::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
html[data-theme="ins"] .cloth .tile.mine::after{width:5px;height:5px}
.dragsrc{opacity:.3}

/* ---------- 共用 ---------- */
.wrap{max-width:470px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border-radius:var(--r-card);padding:14px;margin:8px 0;box-shadow:var(--card-shadow)}
.lab{display:block;font-size:13px;font-weight:800;margin:0 0 6px;color:var(--ink2)}
input{font:inherit;width:100%;padding:12px 15px;border-radius:var(--r-ctl);border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-weight:700}
input::placeholder{color:#8f7f98;font-weight:600}
html[data-theme="ins"] input{box-shadow:inset 0 0 0 1px var(--line-strong)}
html[data-theme="ins"] input::placeholder{color:#8b867c}
.btn{display:block;width:100%;padding:13px 18px;border-radius:var(--r-btn);background:var(--btn-bg);color:var(--accent-ink);font-weight:900;font-size:17px;text-align:center;box-shadow:var(--btn-shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
html[data-theme="ins"] .btn{font-weight:700;letter-spacing:.02em}
html[data-theme="ins"] .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:var(--surface);color:var(--alt-d);box-shadow:inset 0 0 0 2px var(--alt),0 4px 0 var(--alt)}
.btn.alt:active{box-shadow:inset 0 0 0 2px var(--alt),0 1px 0 var(--alt)}
html[data-theme="ins"] .btn.alt{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
html[data-theme="ins"] .btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.ready{background:linear-gradient(180deg,#2fb883,#12805a);box-shadow:0 4px 0 #0c5f42}
html[data-theme="ins"] .btn.ready{background:var(--good);box-shadow:0 3px 0 #064d2e}
.btn:disabled{opacity:.5;pointer-events:none}
.btn + .btn,.btn + .joinrow,.joinrow + .btn{margin-top:10px}
.link{display:block;margin:2px auto;padding:8px 14px;font-weight:800;color:var(--ink2);text-decoration:underline;text-underline-offset:4px}
.note{font-size:13px;line-height:1.6;color:var(--ink2);text-align:center;margin:8px 6px}
.joinrow{display:flex;gap:10px;margin-top:10px}
.joinrow input{text-align:center;letter-spacing:.3em;font-size:18px;text-transform:uppercase}
.joinrow .btn{width:auto;padding:12px 22px;flex:none}
.pwrow{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:8px 13px;border-radius:var(--r-btn);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:14px;white-space:nowrap;flex:none}
html[data-theme="ins"] .chip{border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-strong);font-weight:600}
.chip.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-d)}
html[data-theme="ins"] .chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-weight:700}
.chip:disabled{cursor:default}
.chip.dim{opacity:.7}
.chip.go{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-d)}
html[data-theme="ins"] .chip.go{box-shadow:0 2px 0 var(--accent-d)}
.h2{font-size:15px;font-weight:900;margin:0 0 8px}

/* ---------- 頭像（原創 SVG 角色）---------- */
.avt{display:inline-block;width:var(--s,32px);height:var(--s,32px);flex:none;vertical-align:middle}
.avt svg{width:100%;height:100%;display:block;overflow:visible}
.avt .f{fill:var(--f);stroke:var(--av-line);stroke-width:2;stroke-linejoin:round}
.avt .e{fill:var(--e);stroke:var(--av-line);stroke-width:2;stroke-linejoin:round}
.avt .k{fill:var(--av-line)}
.avt .w{fill:#fff;stroke:var(--av-line);stroke-width:2}
.avt .m{fill:none;stroke:var(--av-line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avt .c{fill:var(--c);opacity:.75}
html[data-theme="ins"] .avt svg{--f:#fbfaf6!important;--e:#e8e4d9!important;--c:transparent!important}
html[data-theme="ins"] .avt .f,html[data-theme="ins"] .avt .e,html[data-theme="ins"] .avt .m,html[data-theme="ins"] .avt .w{stroke-width:1.6}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av{aspect-ratio:1;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;transition:transform .12s;--s:80%}
.av .avt{width:76%;height:76%}
.av:active{transform:scale(.92)}
.av.on{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent);transform:scale(1.05)}
html[data-theme="ins"] .av{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line-strong)}
html[data-theme="ins"] .av.on{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent);transform:none}

/* ---------- 首頁 ---------- */
.logo{display:flex;justify-content:center;gap:12px;margin:4px 0 6px;--tw:50px;--th:68px;padding-top:6px;position:relative}
.logo .tile{cursor:default}
.logo .tile b{font-size:32px}
.logo .tile i{font-size:16px}
.logo .l1{transform:rotate(-8deg)}
.logo .l2{transform:translateY(-8px) rotate(3deg)}
.logo .l3{transform:rotate(9deg)}
html[data-theme="ins"] .logo .tile b{font-size:36px}
html[data-theme="ins"] .logo .l1,html[data-theme="ins"] .logo .l3{transform:none}
html[data-theme="ins"] .logo .l2{transform:none}
html[data-theme="cute"] .logo::before,html[data-theme="cute"] .logo::after{content:"✦";position:absolute;color:var(--accent);opacity:.55;font-size:18px;top:2px}
html[data-theme="cute"] .logo::before{left:14%}
html[data-theme="cute"] .logo::after{right:14%;font-size:13px;top:34px}
.tag{text-align:center;font-weight:800;margin:6px 0 2px;font-size:15px;color:var(--ink2)}
.me-chip{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--card-shadow);text-align:left}
.me-chip .avt{--s:44px}
.me-chip .who{flex:1;min-width:0}
.me-chip .who b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip .who small{display:block;font-size:12px;color:var(--ink2);font-weight:700}
.me-chip .ed{font-size:12px;font-weight:800;color:var(--accent-d);background:var(--accent-soft);padding:5px 10px;border-radius:var(--r-btn)}
html[data-theme="ins"] .me-chip .ed{color:var(--ink);border-radius:8px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:14px;font-weight:900}
.setrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.setrow .lab{margin:0;flex:none;min-width:58px}
.setrow .chips{margin:0;gap:6px}
.chips.sm .chip{padding:6px 11px;font-size:13px}

/* ---------- 大廳 ---------- */
.ticket{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border-radius:var(--r-card);padding:12px 12px 12px 20px;position:relative;margin:10px 0;box-shadow:0 8px 20px rgba(240,190,90,.22)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket small{display:block;font-size:12px;font-weight:800;color:var(--warn)}
.ticket b{font-family:var(--font-num);font-size:34px;letter-spacing:.14em;font-weight:900;line-height:1.1}
.ticket .tb{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.ticket .btn{width:auto;margin:0;padding:8px 14px;font-size:14px}
html[data-theme="ins"] .ticket{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
html[data-theme="ins"] .ticket b{letter-spacing:.2em;font-weight:700}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-ctl);background:var(--surface);min-height:52px;box-shadow:inset 0 0 0 2px var(--line);position:relative;font-weight:800;min-width:0}
.slot .avt{--s:34px}
.slot span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot em{position:absolute;top:-8px;right:10px;font-style:normal;font-size:11px;background:var(--accent);color:var(--accent-ink);padding:1px 9px;border-radius:var(--r-btn)}
.slot.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line-strong);color:var(--ink2);font-weight:700;font-size:13px;justify-content:center}
html[data-theme="ins"] .slot{box-shadow:inset 0 0 0 1px var(--line-strong)}
.slot .x{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);font-size:12px;flex:none}

/* ---------- 遊戲 ---------- */
.game{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
.top{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 5px}
.pls{display:flex;gap:6px;flex:1;min-width:0}
.pl{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px 5px;border-radius:var(--r-ctl);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 2px transparent;transition:background .2s}
.pl .avt{--s:30px}
html[data-theme="ins"] .pl{background:rgba(255,255,255,.8)}
.pl.turn{background:var(--surface);box-shadow:inset 0 0 0 3px var(--accent),0 6px 14px rgba(214,69,122,.2)}
html[data-theme="ins"] .pl.turn{box-shadow:inset 0 0 0 2px var(--accent),0 6px 14px rgba(40,34,24,.1)}
.pl.turn .avt{animation:bob 1.1s ease-in-out infinite}
html[data-theme="ins"] .pl.turn .avt{animation:none}
.pn{font-size:12px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:11px;font-weight:800;color:var(--ink2)}
.cnt.ok{color:var(--good)}
.bub{position:absolute;top:-10px;right:-2px;font-size:24px;line-height:1;animation:floatup 2.6s ease-out forwards;pointer-events:none;z-index:5}
.menu{width:42px;height:42px;border-radius:50%;background:var(--surface);font-size:20px;font-weight:900;box-shadow:0 3px 0 var(--line),inset 0 0 0 1px var(--line);flex:none;line-height:1}
html[data-theme="ins"] .menu{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.stat{margin:0 12px 6px;padding:7px 14px;border-radius:var(--r-btn);background:var(--surface);font-weight:800;font-size:14px;text-align:center;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
html[data-theme="ins"] .stat{box-shadow:inset 0 0 0 1px var(--line-strong);border-radius:12px;font-weight:700}
.stat .avt{--s:22px}
.stat.me{background:var(--warn-soft);box-shadow:0 3px 0 #efd98f}
html[data-theme="ins"] .stat.me{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-d)}
.stat.warn{background:var(--bad-soft);color:var(--bad);box-shadow:0 3px 0 #f5bccb}
html[data-theme="ins"] .stat.warn{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px #e2b9af}
.stat.ready{background:var(--good-soft);color:var(--good);box-shadow:0 3px 0 #a9dcc3}
html[data-theme="ins"] .stat.ready{background:var(--good-soft);color:var(--good);box-shadow:inset 0 0 0 1px #b9d3c3}
.cloth{
  --tw:34px;--th:46px;
  flex:1;min-height:0;margin:0 10px 6px;border-radius:var(--r-card);padding:18px 10px 10px;overflow-y:auto;
  display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px 8px;
  background:var(--felt-img),var(--felt);
  background-size:auto,auto;
  box-shadow:var(--felt-shadow);
}
html[data-theme="ins"] .cloth{background-size:14px 14px,auto}
.cloth.drop{outline:3px dashed var(--accent);outline-offset:-5px}
.plate{display:flex;align-items:center;gap:5px;padding:8px 6px 8px 8px;border-radius:var(--r-ctl);background:var(--surface);position:relative;height:fit-content;box-shadow:0 0 0 2.5px var(--plate-ok),0 6px 12px rgba(120,80,140,.1);transition:transform .12s}
html[data-theme="ins"] .plate{box-shadow:0 0 0 2.5px var(--plate-ok),0 4px 10px rgba(0,0,0,.25)}
.plate.bad{box-shadow:0 0 0 2.5px var(--plate-bad),0 6px 12px rgba(120,80,140,.1)}
html[data-theme="ins"] .plate.bad{box-shadow:0 0 0 2.5px var(--plate-bad),0 4px 10px rgba(0,0,0,.25)}
.plate.bad.shake{animation:wob .4s}
.plate.drop{transform:scale(1.04);outline:3px dashed var(--accent);outline-offset:3px}
.plate .kind{position:absolute;top:-10px;left:14px;font-size:11px;font-weight:900;padding:1px 9px;border-radius:var(--r-btn);background:var(--good-soft);color:var(--good)}
html[data-theme="ins"] .plate .kind{border-radius:6px}
.plate.bad .kind{background:var(--bad-soft);color:var(--bad)}
.ts{display:flex;gap:4px}
.plus{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);font-weight:900;font-size:18px;line-height:1;flex:none}
html[data-theme="ins"] .plus{border-radius:8px}
.plus:active{transform:scale(.9)}
.newset{padding:0 16px;height:calc(var(--th) + 20px);border-radius:var(--r-ctl);border:2.5px dashed var(--line-strong);color:var(--accent-d);font-weight:900;background:rgba(255,255,255,.6);align-self:flex-start}
html[data-theme="ins"] .newset{border:1.5px dashed rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.08);font-weight:700}
.empty-tip{width:100%;text-align:center;color:var(--ink2);font-weight:800;padding:26px 10px;line-height:1.7;background:rgba(255,255,255,.75);border-radius:var(--r-ctl)}
.dock{background:var(--dock-bg);backdrop-filter:blur(12px);border-radius:var(--r-card) var(--r-card) 0 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(120,80,110,.12);transition:box-shadow .3s}
html[data-theme="ins"] .dock{box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(40,34,24,.05)}
.game.myturn .dock{box-shadow:0 -3px 0 var(--accent),0 -10px 26px rgba(214,69,122,.18)}
html[data-theme="ins"] .game.myturn .dock{box-shadow:0 -2px 0 var(--accent),0 -10px 26px rgba(40,34,24,.1)}
.bar{display:flex;gap:6px;overflow-x:auto;padding:0 0 4px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar .chip{padding:8px 13px;font-size:13px}
.rxrow{display:flex;gap:6px;justify-content:center;padding:2px 0 6px}
.rxrow button{width:42px;height:42px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:22px;line-height:1}
html[data-theme="ins"] .rxrow button{border-radius:12px}
.rxrow button:active{transform:scale(.88)}
.rack{display:flex;flex-wrap:wrap;gap:6px 5px;padding:10px 2px 4px;align-content:flex-start;--tw:40px;--th:54px;border-radius:12px}
.rack.drop{background:var(--accent-soft)}
.endrow{display:flex;gap:10px;align-items:center;margin-top:4px}
.clock{position:relative;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,100)*1%),var(--line) 0);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none;font-family:var(--font-num)}
.clock::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.clock span{position:relative}
.clock.nolimit{background:var(--line)}
.clock.hurry{--accent:var(--bad);color:var(--bad);animation:wob .6s infinite}
.pool{font-size:13px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.3;flex:none;min-width:48px}
.pool b{display:block;font-size:18px;color:var(--ink);font-family:var(--font-num)}
.endrow .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-14px);background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;padding:10px 18px;border-radius:var(--r-btn);box-shadow:0 8px 24px rgba(80,50,90,.28);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
html[data-theme="ins"] #toast{background:var(--accent);color:var(--accent-ink);border-radius:12px;font-weight:600}
.modal{position:fixed;inset:0;background:var(--modal-bg);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface-2);width:100%;max-width:520px;border-radius:calc(var(--r-card) + 6px) calc(var(--r-card) + 6px) 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
html[data-theme="ins"] .sheet{background:#fff}
.sheet h3{margin:0 0 12px;font-size:20px}
.sheet ul{padding-left:20px;margin:0 0 14px;line-height:1.75;font-size:15px;font-weight:600}
.sheet .btn{margin-top:12px}
.sheet .setrow{background:var(--surface);padding:8px 10px;border-radius:var(--r-ctl);margin:6px 0}
.sheet input{margin-bottom:10px}

/* ---------- 戰績 / 勝利畫面 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.stats div{background:var(--surface);border-radius:var(--r-ctl);padding:10px 4px;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.stats b{display:block;font-family:var(--font-num);font-size:22px;line-height:1.1}
.stats small{display:block;font-size:11px;color:var(--ink2);font-weight:800;margin-top:3px}
.vic{text-align:center}
.vic .crown{width:46px;height:34px;margin:0 auto -8px;display:block;position:relative;z-index:2;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both .15s}
.vic .crown path{fill:#f5c02e;stroke:var(--av-line);stroke-width:2;stroke-linejoin:round}
html[data-theme="ins"] .vic .crown path{fill:var(--surface);stroke-width:1.6}
.vic .winav{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--accent-soft);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--accent);animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
html[data-theme="ins"] .vic .winav{border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.vic .winav .avt{--s:74px}
.vic h3{margin:12px 0 4px;font-size:22px}
.vic .sub{margin:0 0 10px;color:var(--ink2);font-size:13px;font-weight:700}
.rank{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-ctl);background:var(--surface);margin-bottom:8px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;text-align:left}
html[data-theme="ins"] .rank{box-shadow:inset 0 0 0 1px var(--line-strong)}
.rank .avt{--s:36px}
.rank.win{background:var(--warn-soft);box-shadow:inset 0 0 0 3px #f0c85a}
html[data-theme="ins"] .rank.win{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.rank .sc{margin-left:auto;font-size:18px;font-weight:900;font-family:var(--font-num)}
.rank .sc.pos{color:var(--good)}.rank .sc.neg{color:var(--bad)}
.rank small{display:block;font-size:12px;color:var(--ink2);font-weight:700}
.board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 4px}
.board span{background:var(--surface);padding:4px 10px 4px 6px;border-radius:var(--r-btn);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.board .avt{--s:22px}
.confetti{position:fixed;top:-30px;font-size:24px;z-index:90;pointer-events:none;animation:fall linear forwards}
html[data-theme="ins"] .confetti{font-size:20px;color:var(--accent);opacity:.85}

/* ---------- 玩法說明（圖文）---------- */
.rv{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.rvb{background:var(--surface);border-radius:var(--r-ctl);padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.rvb h4{margin:0 0 8px;font-size:14px;font-weight:900}
.rvb p{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--ink2);font-weight:600}
.ex{display:flex;gap:4px;align-items:center;flex-wrap:wrap;--tw:32px;--th:43px}
.ex .tile{cursor:default;transition:none}
.ex .tile:active{transform:none}
.ex .sep{font-weight:900;color:var(--ink2);padding:0 2px}
.ex .mark{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff}
.ex .mark.ok{background:var(--good)}.ex .mark.no{background:var(--bad)}

/* ---------- 教學提示 ---------- */
.coach{flex:none;margin:0 12px 6px;padding:10px 12px 9px;border-radius:var(--r-ctl);background:var(--surface);box-shadow:0 0 0 2.5px var(--accent),0 8px 20px rgba(120,60,100,.18);animation:up .3s cubic-bezier(.3,1.3,.5,1)}
html[data-theme="ins"] .coach{box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(40,34,24,.12)}
.coach .ct{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:900}
.coach .ct span{font-size:12px;color:var(--ink2);font-weight:800}
.coach p{margin:4px 0 8px;font-size:13px;line-height:1.55;font-weight:600}
.coach .cb{display:flex;gap:6px;align-items:center}
.coach .sp{flex:1}
.coach .chip{padding:6px 12px;font-size:13px}
.tut-hl{outline:3px solid var(--accent);outline-offset:3px;animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{outline-color:var(--accent)}50%{outline-color:transparent}}

/* ---------- 拖曳 ---------- */
.dragghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28));--tw:40px;--th:54px}
.dragghost .gt{display:flex;gap:3px}
.dragghost .tile{transform:rotate(-3deg) scale(1.08)}
.dragghost .badge{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:800 12px/22px system-ui,sans-serif;text-align:center}

/* ---------- 動畫 / 響應式 ---------- */
@keyframes pop{0%{transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.14)}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-30px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes floatup{0%{transform:translateY(8px) scale(.4);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-22px) scale(1);opacity:0}}
@media (max-height:700px){.logo{--tw:40px;--th:54px;margin:0}.logo .tile b{font-size:26px}.tag{display:none}.card{padding:10px;margin:6px 0}}
@media (min-width:720px){.cloth{--tw:40px;--th:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 新流程：歡迎 / 模式 / 設定 / 互動教學 ---------- */
.wrap.full{justify-content:flex-start;gap:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin:0 -4px 6px}
.hdr h1{flex:1;text-align:center;font-size:19px;margin:0;font-weight:900}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:var(--card-shadow)}
.iconbtn.ph{visibility:hidden;box-shadow:none;background:none}
html[data-theme="ins"] .iconbtn{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.welcome{justify-content:space-between}
.welcome .brand{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.welcome .logo{--tw:60px;--th:80px;margin-bottom:10px}
.welcome .logo .tile b{font-size:38px}
.wname{font-size:44px;font-weight:900;margin:8px 0 4px;letter-spacing:.06em;color:var(--ink)}
html[data-theme="ins"] .wname{font-weight:700;letter-spacing:.2em}
.wline{margin:0;font-size:16px;font-weight:700;color:var(--ink2);max-width:18em}
.cta{padding-bottom:10px}
.btn.xl{padding:19px 18px;font-size:21px;border-radius:calc(var(--r-btn) + 4px)}
.cta .link{margin-top:10px;font-size:14px}
.modes{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.mcard{display:flex;align-items:center;gap:14px;width:100%;min-height:92px;padding:16px;border-radius:var(--r-card);background:var(--surface);color:var(--ink);text-align:left;box-shadow:var(--card-shadow);transition:transform .12s}
.mcard:active{transform:scale(.98)}
.mic{flex:none;width:58px;height:58px;border-radius:calc(var(--r-card) - 4px);background:var(--accent-soft);display:grid;place-items:center;font-size:30px;color:var(--accent-d)}
.mic svg{width:30px;height:30px}
html[data-theme="ins"] .mic{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink)}
.mt{flex:1;min-width:0}
.mt b{display:block;font-size:19px;font-weight:900}
.mt small{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--ink2)}
.chev{flex:none;color:var(--ink2)}
.jcard{margin:0;padding:18px 16px}
.wrap.full .body{display:flex;flex-direction:column;gap:2px}
.tutp{flex:none;margin:0 12px 6px;padding:9px 12px;border-radius:var(--r-ctl);background:var(--surface);box-shadow:0 0 0 2.5px var(--accent),0 8px 20px rgba(120,60,90,.15)}
html[data-theme="ins"] .tutp{box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(40,34,24,.12)}
.tutp .dots{display:flex;gap:5px;margin-bottom:6px}
.tutp .dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.tutp .dots i.dn{background:var(--accent)}
.tutp .dots i.on{background:var(--accent);opacity:.55}
.tutp .tt{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900}
.tutp .okm{color:#12805a;font-weight:900}
.tutp p{margin:3px 0 8px;font-size:15px;font-weight:700;line-height:1.45}
.tutp .cb{display:flex;gap:6px;align-items:center}
.tutp .sp{flex:1}
.tutp .chip{padding:8px 14px;font-size:14px}
.tutp .chip:disabled{opacity:.4;pointer-events:none}
.tut-dim{pointer-events:none!important;opacity:.38}
.tut-ok{outline:3px solid var(--accent);outline-offset:2px;animation:glow 1.3s ease-in-out infinite;pointer-events:auto}
#tutarrow{position:fixed;z-index:60;width:28px;text-align:center;font-size:24px;line-height:28px;color:var(--accent-d);pointer-events:none;animation:arrowb .7s ease-in-out infinite;text-shadow:0 1px 0 var(--surface)}
#tutarrow.dn{animation-name:arrowd}
@keyframes arrowb{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes arrowd{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tdone .tips{list-style:none;padding:0;margin:8px 0 14px;text-align:left}
.tdone .tips li{padding:10px 12px;margin:6px 0;border-radius:var(--r-ctl);background:var(--accent-soft);font-weight:800}

/* ---------- 可愛：補回最初版本的毛玻璃卡片 ---------- */
html[data-theme="cute"] .card{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html[data-theme="cute"] .welcome .brand::before{content:"🍚 🧋 🥚 🥬";font-size:20px;letter-spacing:.35em;opacity:.8;margin-bottom:6px}

/* ---------- 首頁：快速開始 / 自定義 ---------- */
.btn.xl{display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.xl .bt{font-size:23px;letter-spacing:.04em}
.btn.xl small{font-size:12.5px;font-weight:700;opacity:.92}
.btn.lg{padding:15px 18px;font-size:18px}
.btn.sec{margin-top:12px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--accent),0 4px 0 var(--accent)}
.btn.sec:active{box-shadow:inset 0 0 0 2.5px var(--accent),0 1px 0 var(--accent)}
html[data-theme="ins"] .btn.sec{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
html[data-theme="fun"] .btn.sec{color:var(--alt-d);box-shadow:inset 0 0 0 2.5px var(--alt),0 4px 0 var(--alt)}
.subl{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:6px}
.subl i{font-style:normal;color:var(--ink2)}
.link.pulse{color:var(--accent-d);animation:glowt 1.6s ease-in-out infinite}
@keyframes glowt{50%{opacity:.45}}
.themes{display:flex;justify-content:center;gap:10px;margin-top:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink2);min-width:74px;padding:4px}
.sw i{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line-strong)}
.sw.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}
.sw.on{color:var(--ink)}
.sw-ins i{background:linear-gradient(135deg,#f5f7fb 0 45%,#1d2a45 45% 70%,#2f5bff 70%)}
.sw-fun i{background:conic-gradient(#e0500c 0 25%,#2563eb 0 50%,#1f8f5f 0 75%,#ffd43b 0)}
.sw-cute i{background:linear-gradient(135deg,#ffd3e4,#dfe2ff 55%,#ffe8c6);position:relative}
.sw-cute i::after{content:"🍚";position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.seat{display:flex;align-items:center;gap:10px;padding:6px 0}
.seat .sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);font-weight:900;font-size:13px;display:grid;place-items:center}
.seat.you b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.you em{font-style:normal;font-size:12px;font-weight:800;color:var(--ink2)}
.seat .avt{--s:34px}
.seat .chips{margin:0;flex:1}
.seat .chip{flex:1;text-align:center;padding:10px 6px;font-size:14px}
.wrap.full .body{flex:1;overflow-y:auto}
.wrap.full>.cta{padding-top:8px}

/* ---------- 活潑繽紛：各區塊色彩 ---------- */
html[data-theme="fun"] .top{background:linear-gradient(180deg,#2563eb,#3b82f6);border-radius:0 0 var(--r-card) var(--r-card);padding-bottom:9px;margin-bottom:6px}
html[data-theme="fun"] .pl{background:rgba(255,255,255,.92)}
html[data-theme="fun"] .pl.turn{background:#fff7cc;box-shadow:inset 0 0 0 3px #ffd43b,0 6px 14px rgba(0,0,0,.2)}
html[data-theme="fun"] .menu{background:#fff;color:var(--alt-d);box-shadow:0 3px 0 #9db6e0}
html[data-theme="fun"] .stat.me{background:#ffd43b;color:#4a3300;box-shadow:0 3px 0 #d9a900}
html[data-theme="fun"] .stat.ready{background:var(--good);color:#fff;box-shadow:0 3px 0 #06532c}
html[data-theme="fun"] .stat.warn{background:var(--bad);color:#fff;box-shadow:0 3px 0 #96172a}
html[data-theme="fun"] .empty-tip,html[data-theme="ins"] .empty-tip{background:rgba(255,255,255,.14);color:#fff}

<script>
//#LOGIC-START
/* ====== 牌的規則（純邏輯） ======
   牌 id：0~103 為一般牌（兩副），104、105 為萬用牌 */
const T=id=>id>=104?{n:0,c:-1,j:true}:{n:(id%13)+1,c:Math.floor((id%52)/13),j:false};
const tval=id=>id>=104?30:T(id).n;

function analyze(ids){
  const n=ids.length;
  if(n<3||n>13) return {ok:false};
  const jk=[],re=[];
  ids.forEach(id=>(id>=104?jk:re).push(id));
  if(!re.length) return {ok:false};
  const ts=re.map(T);
  let best=null;
  if(n<=4 && ts.every(t=>t.n===ts[0].n) && new Set(ts.map(t=>t.c)).size===ts.length){
    best={ok:true,type:'group',val:ts[0].n*n,order:re.slice().sort((a,b)=>T(a).c-T(b).c).concat(jk)};
  }
  if(ts.every(t=>t.c===ts[0].c) && new Set(ts.map(t=>t.n)).size===ts.length){
    const nums=ts.map(t=>t.n),mn=Math.min(...nums),mx=Math.max(...nums);
    const lo=Math.max(1,mx-n+1),hi=Math.min(mn,14-n);
    if(lo<=hi){
      const s=hi,by={};re.forEach(id=>by[T(id).n]=id);
      const order=[];let ji=0,val=0;
      for(let v=s;v<s+n;v++){order.push(by[v]!==undefined?by[v]:jk[ji++]);val+=v;}
      if(!best||val>best.val) best={ok:true,type:'run',val,order};
    }
  }
  return best||{ok:false};
}
function tidy(s){
  const a=analyze(s);
  if(a.ok) return a.order;
  return s.slice().sort((x,y)=>{const A=T(x),B=T(y);if(A.j!==B.j)return A.j?1:-1;return(A.c-B.c)||(A.n-B.n)});
}
function sortRack(arr,mode){
  arr.sort((a,b)=>{const A=T(a),B=T(b);if(A.j!==B.j)return A.j?1:-1;
    return mode==='num'?(A.n-B.n)||(A.c-B.c):(A.c-B.c)||(A.n-B.n)});
  return arr;
}

/* 從手牌找出最佳的一批新組合（電腦玩家 / 提示用） */
function bestNewSets(rack,minPts){
  const cell=Array.from({length:4},()=>Array(14).fill(0));
  const ids=Array.from({length:4},()=>Array.from({length:14},()=>[]));
  const jids=[];
  rack.forEach(id=>{if(id>=104)jids.push(id);else{const t=T(id);cell[t.c][t.n]++;ids[t.c][t.n].push(id)}});
  const cands=[];
  for(let n=1;n<=13;n++){
    for(let mask=1;mask<16;mask++){
      const cs=[0,1,2,3].filter(c=>mask>>c&1);
      if(!cs.every(c=>cell[c][n]>0))continue;
      for(let j=0;j<=jids.length;j++){
        const tot=cs.length+j;if(tot<3||tot>4)continue;
        cands.push({cells:cs.map(c=>[c,n]),j,val:n*tot});
      }
    }
  }
  for(let c=0;c<4;c++)for(let s=1;s<=11;s++)for(let L=3;s+L-1<=13;L++){
    const cells=[];let miss=0,val=0;
    for(let v=s;v<s+L;v++){val+=v;if(cell[c][v]>0)cells.push([c,v]);else miss++}
    if(miss>jids.length||!cells.length)continue;
    cands.push({cells,j:miss,val});
  }
  let best=null,bestScore=-1e9,nodes=0;const used=[];
  (function dfs(start,jleft,tiles,pts,jused){
    if(++nodes>30000)return;
    if(used.length&&pts>=minPts){
      const score=tiles*100+pts-jused*120;
      if(score>bestScore){bestScore=score;best=used.slice()}
    }
    for(let i=start;i<cands.length;i++){
      const cd=cands[i];
      if(cd.j>jleft)continue;
      let ok=true;for(const [c,n] of cd.cells){if(cell[c][n]<=0){ok=false;break}}
      if(!ok)continue;
      cd.cells.forEach(([c,n])=>cell[c][n]--);used.push(i);
      dfs(i,jleft-cd.j,tiles+cd.cells.length+cd.j,pts+cd.val,jused+cd.j);
      used.pop();cd.cells.forEach(([c,n])=>cell[c][n]++);
    }
  })(0,jids.length,0,0,0);
  if(!best)return null;
  const jp=jids.slice();
  return best.map(i=>{
    const cd=cands[i];
    const s=cd.cells.map(([c,n])=>ids[c][n].pop());
    for(let k=0;k<cd.j;k++)s.push(jp.pop());
    return tidy(s);
  });
}

function planBot(table,rack,melded,need30,level){
  level=level||'hard';
  table=table.map(s=>s.slice());rack=rack.slice();let played=0;
  /* 難度：簡單＝只會出新組合、常常失誤；普通＝會接牌；困難＝會接牌也會拆順子重組 */
  if(level==='easy'&&Math.random()<.35)return{table,rack,played:0};
  if(level==='normal'&&Math.random()<.1)return{table,rack,played:0};
  const take=s=>{s.forEach(id=>rack.splice(rack.indexOf(id),1));table.push(s);played+=s.length};
  if(!melded){
    const best=bestNewSets(rack,need30?30:0);
    if(!best)return{table,rack,played:0};
    best.forEach(take);
    return{table,rack,played};
  }
  let again=level!=='easy',guard=0;
  while(again&&guard++<40){
    again=false;
    for(const id of rack){
      if(id>=104)continue;
      for(let i=0;i<table.length;i++){
        const a=analyze(table[i].concat(id));
        if(a.ok){table[i]=a.order;rack.splice(rack.indexOf(id),1);played++;again=true;break}
      }
      if(again)break;
    }
    if(again)continue;
    if(level!=='hard')break;
    for(const id of rack){
      if(id>=104)continue;
      const t=T(id);
      for(let i=0;i<table.length&&!again;i++){
        const s=table[i];
        if(s.some(x=>x>=104))continue;
        const a=analyze(s);
        if(!a.ok||a.type!=='run'||T(s[0]).c!==t.c)continue;
        const ord=a.order,k=ord.findIndex(x=>T(x).n===t.n);
        if(k<0)continue;
        let left=ord.slice(0,k),right=ord.slice(k);
        if(left.length>=2&&right.length>=3){table[i]=left.concat(id);table.push(right)}
        else{
          left=ord.slice(0,k+1);right=ord.slice(k+1);
          if(left.length>=3&&right.length>=2){table[i]=left;table.push([id].concat(right))}
          else continue;
        }
        rack.splice(rack.indexOf(id),1);played++;again=true;
      }
      if(again)break;
    }
  }
  const best=bestNewSets(rack,0);
  if(best)best.forEach(take);
  return{table,rack,played};
}
//#LOGIC-END

  76,0,79,0,76,74,72,0, 72,0,76,0,81,0,79,76, 77,0,81,0,77,76,74,0, 74,0,79,0,76,74,72,0,

/* =====================================================================
   廣告系統（第一階段：架構 + 測試廣告）
   規則：遊戲進行中「完全不出現」廣告。只有兩個地方：
     1. 一局結束後（結算畫面 → 再來一局／回主選單之間）的插頁廣告
     2. 玩家自己進入「兌換」頁，主動按下才播放的獎勵廣告
   橫幅只放在結算畫面與兌換頁底部，預設關閉。
   三層：規則層（Ads）→ 轉接層（mock / admob / none）→ 事件層（Ads.on）
   ===================================================================== */
const ADS_CFG={
  enabled:false,                       /* 總開關：預設關。開發者面板可開；正式版由設定檔決定 */
  interstitial:{skipFirst:3,everyN:3,minGapSec:180},   /* 前 3 局不出，之後每 3 局一次，至少間隔 3 分鐘 */
  banner:{enabled:false},              /* 橫幅：只在結算與兌換頁，預設關 */
  rewarded:{dailyCap:5,bankMax:5},     /* 每日上限、最多存幾次提示 */
  timeoutMs:6000                       /* 載入逾時：超過就當作沒廣告，不讓玩家等 */
};
/* Google 官方公開的「測試用」廣告 ID（開發期只准用這些；正式上架前再換成自己的）。
   接 SDK 時請對照 AdMob 官方文件再確認一次。 */
const ADS_TEST_IDS={
  android:{app:'ca-app-pub-3940256099942544~3347511713',banner:'ca-app-pub-3940256099942544/6300978111',interstitial:'ca-app-pub-3940256099942544/1033173712',rewarded:'ca-app-pub-3940256099942544/5224354917'},
  ios:{app:'ca-app-pub-3940256099942544~1458002511',banner:'ca-app-pub-3940256099942544/2934735716',interstitial:'ca-app-pub-3940256099942544/4411468910',rewarded:'ca-app-pub-3940256099942544/1712485313'}
};
const adDay=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const adWithTimeout=(p,ms,dflt)=>new Promise(res=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;res(dflt)}},ms);Promise.resolve(p).then(v=>{if(!done){done=true;clearTimeout(t);res(v)}},()=>{if(!done){done=true;clearTimeout(t);res(dflt)}})});

/* 之後要接上的位置（目前「完全沒有接線」，遊戲程式沒有任何改動）：
   1. 一局結束記錄時           → Ads.onGameEnd()                （rt2.js 的 recordResult）
   2. 結算畫面按「再來一局／回主選單」前 → await Ads.showInterstitial()（rt2.js 的 again／leave）
   3. 兌換頁的「看廣告領取」     → await Ads.showRewarded()
   4. 結算畫面／兌換頁底部       → Ads.bannerOn 為真才放橫幅位置
   5. VIP 購買完成               → Ads.st.vip=true; Ads.save()
   6. 收益與曝光分析             → Ads.on(e=>送到 Firebase Analytics)；金額以 AdMob 後台為準
   新增廣告形式：在轉接層（MOCK／ADMOB）加 load/show 的新 kind，再於規則層加一條規則即可。 */
const Ads={
  KEY:'rummi:ads',
  st:null,log:[],lis:[],adapter:null,
  def(){return{games:0,sinceAd:0,lastAd:0,imp:{interstitial:0,rewarded:0,banner:0},done:{rewarded:0},fail:0,
    day:adDay(),rwToday:0,bank:0,vip:false,dev:false,on:null,banner:null,failSim:false}},
  load(){
    let o=null;try{o=JSON.parse(localStorage.getItem(this.KEY)||'null')}catch(e){}
    this.st=Object.assign(this.def(),o&&typeof o==='object'?o:{});
    this.st.imp=Object.assign({interstitial:0,rewarded:0,banner:0},this.st.imp);this.st.done=Object.assign({rewarded:0},this.st.done);
    if(this.st.day!==adDay()){this.st.day=adDay();this.st.rwToday=0}
    this.adapter=this.pick();
  },
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.st))}catch(e){}},
  native(){try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}catch(e){return false}},
  pick(){return this.native()?ADMOB:MOCK},
  /* ---- 開關 ---- */
  get enabled(){return this.st.on===null?ADS_CFG.enabled:!!this.st.on},
  get vip(){return !!this.st.vip},
  get bannerOn(){return this.enabled&&!this.vip&&(this.st.banner===null?ADS_CFG.banner.enabled:!!this.st.banner)},
  /* ---- 事件層（之後可接 Firebase Analytics 等）---- */
  emit(name,data){
    const e=Object.assign({e:name,t:Date.now()},data||{});
    this.log.push(e);if(this.log.length>60)this.log.shift();
    this.lis.forEach(f=>{try{f(e)}catch(x){}});
    try{window.dispatchEvent(new CustomEvent('rummi-ads',{detail:e}))}catch(x){}
  },
  on(f){this.lis.push(f)},
  /* ---- 規則層 ---- */
  onGameEnd(){const c=ADS_CFG.interstitial,s=this.st;s.games++;if(s.games>c.skipFirst)s.sinceAd++;this.save()},
  interstitialDue(){
    if(!this.enabled||this.vip)return false;
    const c=ADS_CFG.interstitial,s=this.st;
    return s.sinceAd>=c.everyN&&Date.now()-s.lastAd>=c.minGapSec*1000;
  },
  /* 回傳 true=有顯示；false=沒廣告（呼叫端直接往下走，不用等） */
  async showInterstitial(force){
    if(!force&&!this.interstitialDue())return false;
    this.emit('ad_request',{kind:'interstitial'});
    const ok=await adWithTimeout(this.adapter.load('interstitial'),ADS_CFG.timeoutMs,false);
    if(!ok){this.st.fail++;this.save();this.emit('ad_failed',{kind:'interstitial'});return false}
    this.emit('ad_loaded',{kind:'interstitial'});
    this.st.sinceAd=0;this.st.lastAd=Date.now();this.st.imp.interstitial++;this.save();
    this.emit('ad_impression',{kind:'interstitial'});
    try{await this.adapter.show('interstitial')}catch(e){}
    this.emit('ad_closed',{kind:'interstitial'});
    return true;
  },
  rewardLeft(){return Math.max(0,ADS_CFG.rewarded.dailyCap-(this.st.day===adDay()?this.st.rwToday:0))},
  bankFull(){return this.st.bank>=ADS_CFG.rewarded.bankMax},
  /* 玩家主動看獎勵廣告：回傳 'ok' | 'fail' | 'cap' | 'full' | 'skipped'（中途關掉不給獎勵） */
  async showRewarded(){
    if(!this.enabled)return 'fail';
    if(this.rewardLeft()<=0)return 'cap';
    if(this.bankFull())return 'full';
    this.emit('ad_request',{kind:'rewarded'});
    const ok=await adWithTimeout(this.adapter.load('rewarded'),ADS_CFG.timeoutMs,false);
    if(!ok){this.st.fail++;this.save();this.emit('ad_failed',{kind:'rewarded'});return 'fail'}
    this.emit('ad_loaded',{kind:'rewarded'});
    this.st.imp.rewarded++;this.save();this.emit('ad_impression',{kind:'rewarded'});
    let earned=false;
    try{earned=!!(await this.adapter.show('rewarded'))}catch(e){}
    this.emit('ad_closed',{kind:'rewarded',earned});
    if(!earned)return 'skipped';
    /* 之後接上 AdMob 伺服器端驗證（SSV）時，改成：驗證通過才發放 */
    this.st.done.rewarded++;this.st.rwToday++;this.st.bank=Math.min(ADS_CFG.rewarded.bankMax,this.st.bank+1);this.save();
    this.emit('reward_earned',{kind:'rewarded',reward:'hint'});
    return 'ok';
  },
  /* 開局時領走存起來的提示（只限單人對電腦，由呼叫端判斷） */
  takeHints(){const n=this.st.bank|0;if(n>0){this.st.bank=0;this.save()}return n},
  bannerSeen(){this.st.imp.banner++;this.save();this.emit('banner_impression',{kind:'banner'})},
  resetCounters(){const k=this.st;k.games=0;k.sinceAd=0;k.lastAd=0;k.imp={interstitial:0,rewarded:0,banner:0};k.done={rewarded:0};k.fail=0;k.rwToday=0;k.bank=0;this.log.length=0;this.save()}
};

/* ---- 轉接層：測試模擬（網頁版／開發期）---- */
const MOCK={
  name:'mock',
  async load(kind){await new Promise(r=>setTimeout(r,120));return !Ads.st.failSim},
  show(kind){
    return new Promise(res=>{
      const secs=kind==='rewarded'?5:3;let left=secs,earned=false;
      const el=document.createElement('div');el.className='adov';el.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:600 15px system-ui,sans-serif;color:#222';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
      const R=kind==='rewarded';
      const paint=()=>{
        el.innerHTML=`<div class="adbox" style="background:#fff;border-radius:16px;padding:20px;width:min(88vw,320px);text-align:center"><span class="adtag">測試廣告</span>
          <p class="adline">${R?'這是測試用的獎勵廣告畫面':'這是測試用的插頁廣告畫面'}</p>
          <p class="adwait">${left>0?(R?`再 ${left} 秒即可領取獎勵`:`${left} 秒後可關閉`):(R?'獎勵已解鎖！':'')}</p>
          <button data-ad="close" ${left>0&&!R?'disabled':''}>${left>0&&R?'放棄':(R?'領取獎勵':'關閉')}</button></div>`;
      };
      const finish=()=>{clearInterval(tm);el.remove();res(kind==='rewarded'?earned:true)};
      const tm=setInterval(()=>{left--;if(left<=0){left=0;earned=true;clearInterval(tm)}paint()},1000);
      el.addEventListener('click',e=>{const b=e.target.closest('[data-ad=close]');if(b&&!b.disabled){e.stopPropagation();finish()}});
      paint();document.body.appendChild(el);
    });
  }
};
/* ---- 轉接層：AdMob（iOS／Android App）。骨架：等打包成 App 並安裝
   @capacitor-community/admob 外掛後才能實測；目前網頁版不會走到這裡。---- */
const ADMOB={
  name:'admob',
  ids(){const p=(window.Capacitor&&Capacitor.getPlatform&&Capacitor.getPlatform())==='ios'?'ios':'android';return ADS_TEST_IDS[p]},
  plug(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.AdMob},
  async load(kind){
    const P=this.plug();if(!P)return false;
    try{
      if(!this.inited){await P.initialize({initializeForTesting:true});this.inited=true}
      if(kind==='interstitial')await P.prepareInterstitial({adId:this.ids().interstitial,isTesting:true});
      else await P.prepareRewardVideoAd({adId:this.ids().rewarded,isTesting:true});
      return true;
    }catch(e){return false}
  },
  async show(kind){
    const P=this.plug();if(!P)return false;
    if(kind==='interstitial'){await P.showInterstitial();return true}
    const r=await P.showRewardVideoAd();return !!(r&&(r.amount>0||r.type));
  }
};
Ads.load();

/* ====== 儲存層 ======
   mem：單人（記憶體）／ host：房主持有資料，朋友透過 PeerJS 對房主讀寫 ／ storage：Claude 共享儲存（備援） */
const mem=new Map();let remoteOK=false;
const Store={
  mode:'mem',rpc:null,
  async get(k){try{
    if(this.rpc)return await this.rpc('get',k);
    if(this.blocked())return null;
    if(this.mode==='storage'){const r=await window.storage.get(k,true);return r&&r.value!=null?JSON.parse(r.value):null}
    return mem.has(k)?JSON.parse(mem.get(k)):null}catch(e){return null}},
  blocked(){return this.mode==='mem'&&typeof S!=='undefined'&&S.online&&!S.host},
  async set(k,v){try{
    if(this.rpc)return !!await this.rpc('set',k,v);
    if(this.blocked())return false;
    if(this.mode==='storage'){const r=await window.storage.set(k,JSON.stringify(v),true);return !!r}
    mem.set(k,JSON.stringify(v));snapSoon();return true}catch(e){console.warn('store set',e);return false}},
  async del(k){try{
    if(this.rpc){await this.rpc('del',k);return}
    if(this.blocked())return;
    if(this.mode==='storage')await window.storage.delete(k,true);else{mem.delete(k);snapSoon()}}catch(e){}},
  async list(p){try{
    if(this.rpc)return (await this.rpc('list',p))||[];
    if(this.blocked())return [];
    if(this.mode==='storage'){const r=await window.storage.list(p,true);return(r&&r.keys)||[]}
    return[...mem.keys()].filter(k=>k.startsWith(p))}catch(e){return[]}}
};

/* ====== PeerJS 連線：房主＝伺服器 ====== */
const NET={peer:null,conns:new Set(),hostConn:null,pw:'',myPw:'',snap:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 房主定時把整個房間備份給所有朋友；房主消失時，朋友之一用備份接任房主 */
function snapObj(){const o={},pre=`rummi:${S.code}:`;for(const [k,v] of mem)if(k.startsWith(pre))o[k]=v;return o}
let snapT=null;
function snapSoon(){
  if(typeof S==='undefined'||!S.host||!S.code||!NET.conns.size||snapT)return;
  snapT=setTimeout(()=>{snapT=null;flushSnap()},120);
}
function flushSnap(c){
  if(typeof S==='undefined'||!S.host||!S.code)return;
  const o=snapObj();
  const list=c?[c]:[...NET.conns].filter(x=>x.auth);
  list.forEach(x=>{try{x.send({snap:o})}catch(e){}});
}
const peerOK=()=>typeof window.Peer==='function';
const PID=code=>'rummi-'+code.toLowerCase();
function netClose(){
  try{NET.conns.forEach(c=>{try{c.close()}catch(e){}})}catch(e){}
  NET.conns.clear();
  try{if(NET.hostConn)NET.hostConn.close()}catch(e){}
  try{if(NET.peer)NET.peer.destroy()}catch(e){}
  NET.peer=null;NET.hostConn=null;Store.rpc=null;
}
function serveReq(c,m){
  if(!m||typeof m!=='object')return;
  if(m.op==='hello'){
    const ok=!NET.pw||String(m.pw||'')===NET.pw;
    if(ok){c.auth=true;c.pid=String(m.id||'');try{c.send({hello:'ok'})}catch(e){}flushSnap(c);goBack(c.pid)}
    else{try{c.send({hello:'pw'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},300)}
    return;
  }
  if(!c.auth){try{c.send({i:m.i,r:null})}catch(e){}return}
  let r=null;
  try{
    if(m.op==='get')r=mem.has(m.k)?JSON.parse(mem.get(m.k)):null;
    else if(m.op==='set'){mem.set(m.k,JSON.stringify(m.v));snapSoon();r=true}
    else if(m.op==='del'){mem.delete(m.k);snapSoon();r=true}
    else if(m.op==='back'){goBack(c.pid);r=true}
    else if(m.op==='list')r=[...mem.keys()].filter(k=>k.startsWith(m.k));
    else if(m.op==='leave'){handleLeave(c.pid);r=true}
  }catch(e){r=null}
  try{c.send({i:m.i,r})}catch(e){}
}
function hostPeer(code){
  return new Promise((resolve,reject)=>{
    let done=false;const p=new Peer(PID(code),{debug:0});
    const fail=e=>{if(done)return;done=true;try{p.destroy()}catch(x){}reject(e)};
    const to=setTimeout(()=>fail({type:'timeout'}),9000);
    let opened=false;
    p.on('open',()=>{if(done)return;done=true;opened=true;clearTimeout(to);NET.peer=p;resolve()});
    p.on('error',e=>{clearTimeout(to);if(opened){if(e&&e.type==='unavailable-id')demoteHost();return}fail(e)});
    p.on('connection',c=>{
      NET.conns.add(c);
      c.on('data',m=>serveReq(c,m));
      c.on('close',()=>{NET.conns.delete(c);if(c.auth&&c.pid)handleLeave(c.pid)});
      c.on('error',()=>{});
    });
    p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}});
  });
}
function joinPeer(code,pw){
  return new Promise((resolve,reject)=>{
    let done=false,seq=0;const pend=new Map();const p=new Peer(undefined,{debug:0});
    const fail=e=>{if(done)return;done=true;clearTimeout(to);try{p.destroy()}catch(x){}reject(e)};
    const to=setTimeout(()=>fail({type:'timeout'}),12000);
    p.on('error',e=>fail(e));
    p.on('open',()=>{
      const c=p.connect(PID(code),{reliable:true,serialization:'json'});
      c.on('error',e=>fail(e));
      c.on('open',()=>{try{c.send({op:'hello',id:S.me.id,pw:pw||''})}catch(e){fail({type:'send'})}});
      c.on('data',m=>{
        if(m&&m.hello){
          if(done)return;
          if(m.hello==='ok'){
            done=true;clearTimeout(to);NET.peer=p;NET.hostConn=c;NET.myPw=pw||'';
            Store.rpc=(op,k,v)=>new Promise(res=>{
              if(!c.open){res(null);return}
              const i=++seq;pend.set(i,res);
              try{c.send({i,op,k,v})}catch(e){pend.delete(i);res(null);return}
              setTimeout(()=>{if(pend.has(i)){pend.delete(i);res(null)}},7000);
            });
            resolve();
          }else fail({type:'badpw'});
          return;
        }
        if(m&&m.snap){NET.snap=m.snap;return}
        if(m&&pend.has(m.i)){pend.get(m.i)(m.r);pend.delete(m.i)}
      });
      c.on('close',()=>{pend.forEach(f=>f(null));pend.clear();if(NET.hostConn===c){NET.hostConn=null;onHostGone()}});
    });
  });
}
let migrating=false;
const hideToast=()=>{const t=$('#toast');if(t)t.classList.remove('show')};
function loadSnap(snap){mem.clear();for(const k in snap)mem.set(k,snap[k])}
/* 與房主的連線中斷：對局中就嘗試「接任房主」或「重新加入新房主」，不行才回首頁 */
async function onHostGone(){
  if(!S.code||migrating)return;
  const code=S.code,pw=NET.myPw||'',snap=NET.snap,st=S.st;
  const can=S.online&&st&&st.phase==='play'&&snap&&snap[`rummi:${code}:s`];
  if(!can){toast(tr('hostLeft'));resetHome();return}
  migrating=true;stopPoll();netClose();
  toast(tr('reconnecting'),60000);
  try{
    for(let i=0;i<14&&S.code===code;i++){
      loadSnap(snap);
      let claimed=false;
      try{await hostPeer(code);claimed=true}catch(e){}
      if(claimed){await becomeHost(code,pw);hideToast();return}
      try{const r=await rejoinGuest(code,pw);if(r)return}catch(e){}
      await sleep(1200+Math.random()*900);
    }
    if(S.code===code){toast(tr('hostLeft'));resetHome()}
  }finally{migrating=false}
}
async function becomeHost(code,pw){
  NET.pw=pw;S.host=true;S.online=true;Store.mode='mem';Store.rpc=null;
  const raw=mem.get(K('s'));const st=raw?JSON.parse(raw):null;
  if(!st||st.phase!=='play'){toast(tr('hostLeft'));resetHome();return}
  const old=st.host,op=st.players.find(p=>p.id===old);
  st.host=S.me.id;
  if(op&&old!==S.me.id){op.auto=true;st.msg={k:'hostmv',name:pname(op)}}
  st.v=Math.max(st.v,S.st?S.st.v:0)+5;
  mem.set(K('s'),JSON.stringify(st));
  S.st=null;S.turnSeq=-1;startPoll();
  await onState(st);hostDuties();
  /* 給朋友一點時間連回來；還沒回來的先由電腦代打 */
  setTimeout(()=>{
    if(!S.host||!S.st||S.st.phase!=='play')return;
    const here=new Set([...NET.conns].filter(c=>c.auth).map(c=>c.pid));
    S.st.players.forEach(p=>{if(!p.bot&&!p.auto&&p.id!==S.me.id&&!here.has(p.id))goAway(p.id)});
  },25000);
}
async function rejoinGuest(code,pw){
  netClose();
  await joinPeer(code,pw);
  NET.myPw=pw||'';Store.mode='mem';S.host=false;
  const st=await Store.get(K('s'));
  if(!st){netClose();throw {type:'nostate'}}
  if(st.phase==='closed'||!st.players.some(p=>p.id===S.me.id)){toast(tr('hostLeft'));resetHome();return 'gone'}
  S.st=null;S.turnSeq=-1;startPoll();hideToast();await onState(st);return true;
}
/* 舊房主回來了，但房主位置已被別人接任：改當一般玩家加入 */
async function demoteHost(){
  if(!S.host||!S.code||migrating)return;
  migrating=true;const code=S.code,pw=NET.pw;
  stopPoll();S.host=false;netClose();toast(tr('reconnecting'),60000);
  try{
    for(let i=0;i<8;i++){try{if(await rejoinGuest(code,pw))return}catch(e){await sleep(1500)}}
    toast(tr('hostLeft'));resetHome();
  }finally{migrating=false}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||typeof S==='undefined'||!S.code||migrating)return;
  if(S.host&&NET.peer&&NET.peer.disconnected&&!NET.peer.destroyed){try{NET.peer.reconnect()}catch(e){}}
  else if(S.online&&!S.host&&S.st&&S.st.phase==='play'&&NET.hostConn&&!NET.hostConn.open)onHostGone();
});

function savePrefs(){
  const data=JSON.stringify({name:S.me.name,av:S.me.av,pref:S.pref,cfg:S.cfg,td:S.tutDone,stats:S.stats});
  try{localStorage.setItem('rummi:profile',data)}catch(e){}
  try{if(window.storage){const r=window.storage.set('rummi:profile',data,false);if(r&&r.catch)r.catch(()=>{})}}catch(e){}
}
function loadSid(){
  try{const v=sessionStorage.getItem('rummi:sid');if(v&&/^[a-z0-9]{4,20}$/i.test(v))S.me.id=v;else sessionStorage.setItem('rummi:sid',S.me.id)}catch(e){}
  try{const r=JSON.parse(sessionStorage.getItem('rummi:last')||'null');if(r&&r.code&&Date.now()-r.t<2400000)S.lastRoom=r}catch(e){}
}
function saveLast(){try{sessionStorage.setItem('rummi:last',JSON.stringify({code:S.code,pw:S.host?NET.pw:(NET.myPw||''),t:Date.now()}));S.lastRoom={code:S.code,pw:S.host?NET.pw:(NET.myPw||''),t:Date.now()}}catch(e){}}
function clearLast(){S.lastRoom=null;try{sessionStorage.removeItem('rummi:last')}catch(e){}}
async function loadProfile(){
  loadSid();
  let raw=null;
  try{if(window.storage){const r=await window.storage.get('rummi:profile',false);if(r&&r.value)raw=r.value}}catch(e){}
  if(!raw){try{raw=localStorage.getItem('rummi:profile')}catch(e){}}
  if(!raw)return;
  try{
    const p=JSON.parse(raw);
    if(typeof p.name==='string')S.me.name=p.name.slice(0,8);
    if(typeof p.av==='string')S.me.av='a'+avIdx(p.av);   /* 舊版 emoji 頭像 → 第 1 個角色 */
    const q=p.pref||{};
    if(I18N[q.lang])S.pref.lang=q.lang;
    if(THEMES[q.theme])S.pref.theme=q.theme;
    if(typeof q.tut==='boolean')S.pref.tut=q.tut;
    if(typeof q.sfx==='boolean')S.pref.sfx=q.sfx;
    if(typeof q.music==='boolean')S.pref.music=q.music;
    if(['calm','lofi','orig'].includes(q.track))S.pref.track=q.track;
    S.tutDone=p.td===true||p.setup===true;
    const c=p.cfg;
    if(c&&Array.isArray(c.seats)&&c.seats.length===3&&c.seats.every(x=>['off','bot','human'].includes(x))&&c.seats.some(x=>x!=='off')){
      S.cfg.seats=c.seats.slice();if(DIFFS.includes(c.diff))S.cfg.diff=c.diff;if(TIMERS.includes(c.timer))S.cfg.timer=c.timer;if(typeof c.meld30==='boolean')S.cfg.meld30=c.meld30;if(HINTS.includes(c.hints))S.cfg.hints=c.hints;
    }
    if(p.stats&&typeof p.stats.g==='number'){
      const d=newStats();
      S.stats={g:p.stats.g|0,w:p.stats.w|0,streak:p.stats.streak|0,best:p.stats.best|0,
        solo:Object.assign(d.solo,p.stats.solo||{}),online:Object.assign(d.online,p.stats.online||{})};
    }
  }catch(e){}
}
async function probe(){try{if(!window.storage)return false;const r=await window.storage.set('rummi:probe',String(Date.now()),true);return !!r}catch(e){return false}}
async function ensureRemote(){if(!remoteOK)remoteOK=peerOK()||await probe();return remoteOK}

function recordResult(st){
  if(!st||st.phase!=='over'||S.recGid===st.gid)return;
  if(!st.players.some(p=>p.id===S.me.id))return;
  S.recGid=st.gid;
  const win=st.winner===S.me.id,sg=S.stats,m=S.online?sg.online:sg.solo;
  sg.g++;m.g=(m.g||0)+1;
  if(win){sg.w++;m.w=(m.w||0)+1;sg.streak++;sg.best=Math.max(sg.best,sg.streak)}else sg.streak=0;
  savePrefs();
}
const winRate=s=>s.g?Math.round(s.w*100/s.g):0;

function meldInfo(){
  const pool={};
  S.startTable.forEach(s=>{const k=s.slice().sort((a,b)=>a-b).join(',');pool[k]=(pool[k]||0)+1});
  let pts=0,ok=true;
  for(const s of S.table){
    if(s.every(id=>S.startRackSet.has(id))){const a=analyze(s);pts+=a.ok?a.val:0}
    else{const k=s.slice().sort((a,b)=>a-b).join(',');if(pool[k]>0)pool[k]--;else ok=false}
  }
  if(Object.values(pool).some(v=>v>0))ok=false;
  return{ok,pts};
}
const playedCount=()=>S.startRackArr.length-S.rack.length;

/* 這回合的狀態：決定狀態列文字、顏色，以及「完成出牌」按鈕是否亮綠 */
function turnInfo(){
  const st=S.st,pl=st.players[st.turn];
  if(st.phase==='over')return{cls:'',html:tr('over'),ready:false};
  if(!isMyTurn())return{cls:'',html:`${avH(pl.av)}<span>${tr('thinking',esc(pname(pl)))}</span>`,ready:false};
  const me=st.players[myIdx()]||{},played=playedCount(),needMeld=!me.meld&&st.settings.meld30;
  const mi=needMeld?meldInfo():null;
  if(played===0)return{cls:'me',html:`${IC('turn')}${tr('myTurn')}${mi?`　${tr('firstMeldPts',0)}`:''}`,ready:false};
  if(S.table.some(s=>!analyze(s).ok))return{cls:'warn',html:`⚠ ${tr('badSets')}`,ready:false};
  if(!me.meld){
    const m2=meldInfo();
    if(!m2.ok)return{cls:'warn',html:`⚠ ${tr('meldNoTouch')}`,ready:false};
    if(st.settings.meld30&&m2.pts<30)return{cls:'warn',html:`⚠ ${tr('firstMeldPts',m2.pts)}`,ready:false};
  }
  return{cls:'ready',html:`✓ ${tr('readyDone')}`,ready:true};
}

/* ====== 互動教學：就在真正的牌桌上操作 ====== */
const TUT=['face','group','run','play','draw','done'];
const tid=(c,n,k)=>(k||0)*52+c*13+(n-1);
const TUTSCENE={
  face:()=>({rack:[tid(1,4),tid(0,9),tid(3,2),tid(1,11),tid(2,6)],table:[],startTable:[]}),
  group:()=>({rack:[tid(0,7),tid(2,2),tid(1,7),tid(3,12),tid(3,7)],table:[],startTable:[]}),
  run:()=>{const t=[[tid(2,4),tid(2,5),tid(2,6)]];return{rack:[tid(2,7),tid(0,12),tid(1,3),tid(3,9)],table:t,startTable:t}},
  play:()=>({rack:[tid(0,2),tid(1,9),tid(2,12)],table:[[tid(3,5),tid(3,6),tid(3,7)]],startTable:[],extra:[tid(3,5),tid(3,6),tid(3,7)]}),
  draw:()=>({rack:[tid(0,1),tid(1,5),tid(2,9),tid(3,12),tid(0,13)],table:[],startTable:[]})
};
function tutLoad(){
  const k=TUT[S.tutM.step],sc=(TUTSCENE[k]||TUTSCENE.draw)();
  S.rack=sc.rack.slice();S.table=clone(sc.table);S.startTable=clone(sc.startTable);
  S.startRackArr=sc.rack.concat(sc.extra||[]);S.startRackSet=new Set(S.startRackArr);
  S.sel=new Set();S.fresh=null;S.tutM.end=false;
}
function startTutorial(from){

    settings:{timer:0,meld30:false,diff:'easy'},seq:1,msg:null,table:[],pool:Array.from({length:60},(_,i)=>i),turn:0,gid:'tut',board:{}};
  S.tutM={step:0,from,end:false};S.deadline=0;S.screen='game';tutLoad();render();

function tutExit(){
  S.tutDone=true;savePrefs();S.tutM=null;S.st=null;S.rack=[];S.table=[];S.startRackArr=[];S.startRackSet=new Set();S.startTable=[];

function tutCond(){
  const m=S.tutM;if(!m)return false;
  const k=TUT[m.step],ok=(s,t,n)=>{const a=analyze(s);return a.ok&&a.type===t&&s.length>=n};
  switch(k){
    case'face':return S.sel.size>0;
    case'group':return S.table.some(s=>ok(s,'group',3));
    case'run':return S.table.some(s=>ok(s,'run',4));
    case'play':case'draw':return m.end;
  }
  return false;
}
function tutAllow(){
  const k=TUT[S.tutM.step],d=n=>`.game .tile[data-t="${n}"]`,und='.game .bar .chip[data-act="undo"]';
  switch(k){
    case'face':return{ok:[d(tid(1,4))],pt:d(tid(1,4))};
    case'group':{
      const a=[tid(0,7),tid(1,7),tid(3,7)],left=a.find(x=>S.rack.includes(x)&&!S.sel.has(x));
      return{ok:a.map(d).concat(['.game .bar .chip.go','.game .newset',und]),pt:left!==undefined?d(left):'.game .bar .chip.go'};
    }
    case'run':{
      const t=tid(2,7);
      return{ok:[d(t),'.game .plus',und],pt:(S.rack.includes(t)&&!S.sel.has(t))?d(t):'.game .plus'};
    }
    default:return{ok:['.game .endrow .btn'],pt:'.game .endrow .btn'};
  }
}
function tutDecorate(){
  const old=document.getElementById('tutarrow');if(old)old.remove();
  if(!S.tutM||S.screen!=='game')return;
  document.querySelectorAll('.game .tile,.game .chip,.game .btn,.game .plus,.game .newset,.game .menu,.game .hintfab').forEach(e=>{if(!e.closest('.tutp'))e.classList.add('tut-dim')});
  if(TUT[S.tutM.step]==='done')return;
  const A=tutAllow();
  A.ok.forEach(q=>document.querySelectorAll(q).forEach(e=>{e.classList.remove('tut-dim');e.classList.add('tut-ok')}));
  if(tutCond())return;
  const el=A.pt&&document.querySelector(A.pt);if(!el)return;
  const r=el.getBoundingClientRect(),a=document.createElement('div');a.id='tutarrow';a.setAttribute('aria-hidden','true');

}

function rOver(){
  const st=S.st,sg=S.stats;
  const w=st.players.find(p=>p.id===st.winner),mine=st.winner===S.me.id;
  const rows=(st.scores||[]).slice().sort((a,b)=>b.delta-a.delta).map(r=>{
    const p=st.players.find(x=>x.id===r.id);if(!p)return '';
    return `<div class="rank ${r.id===st.winner?'win':''}">${avH(p.av)}<div>${r.id===st.winner?IC('trophy'):''}${esc(pname(p))}<small>${tr('remain',r.sum)}</small></div><span class="sc ${r.delta>=0?'pos':'neg'}">${r.delta>=0?'+':''}${r.delta}</span></div>`;
  }).join('');
  const board=st.board||{};
  const bh=st.players.filter(p=>board[p.id]).map(p=>`<span>${avH(p.av)}${esc(pname(p))} <b>${board[p.id]}</b></span>`).join('');
  const sub=st.endBy==='left'?tr('onlyYou'):tr('statLine',sg.g,sg.w,winRate(sg),sg.streak);
  return `<div class="modal"><div class="sheet vic">
    ${w?`${CROWN}<div class="winav">${avH(w.av)}</div>`:''}
    <h3>${mine?tr('youWin'):w?tr('wins',esc(pname(w))):tr('gameOver')}</h3>
    <p class="sub">${sub}</p>

function fitTiles(){
  const rk=$('#rack'),tb=$('#table');if(!rk||!tb)return;
  const big=window.innerWidth>=720,r=54/40;
  const setv=(el,w)=>{el.style.setProperty('--tw',w+'px');el.style.setProperty('--th',Math.round(w*r)+'px')};
  let w=big?46:40;setv(rk,w);
  const cap=Math.max(84,window.innerHeight*0.26);
  while(rk.scrollHeight>cap&&w>20){w-=2;setv(rk,w)}
  let t1=big?40:34;setv(tb,t1);
  while(tb.scrollHeight>tb.clientHeight+1&&t1>18){t1-=2;setv(tb,t1)}
}

function fmtMsg(m){

function startPoll(){stopPoll();S.pollT=setInterval(poll,1600)}

async function poll(){

    const cur=await Store.get(K('s'));
    if(cur===null&&!S.host&&Store.rpc&&S.st&&S.st.phase==='play'){if(++S.nullN>=4){S.nullN=0;polling=false;onHostGone();return}}else S.nullN=0;

      const rx=await Store.get(K('rx'));

    }

async function onState(cur){
  const prev=S.st;
  if(cur.phase==='closed'){toast(tr('hostLeft'));resetHome();return}
  S.st=cur;
  {const me=cur.players.find(p=>p.id===S.me.id);
   if(me&&me.auto&&!S.host&&Store.rpc&&!S.backSent){S.backSent=true;Store.rpc('back').then(()=>{S.backSent=false})}}
  if(cur.phase==='lobby'){S.screen='lobby';S.turnSeq=-1;render();return}
  if(!cur.players.some(p=>p.id===S.me.id)){toast(tr('notInList'));resetHome();return}
  const first=S.screen!=='game'||!prev||prev.phase==='lobby';
  S.screen='game';
  if(cur.gid!==S.gid){S.gid=cur.gid;S.rack=[];S.rxSeen=null;S.hintLeft=Math.max(0,(cur.settings.hints===undefined?3:cur.settings.hints))}
  if(first||cur.seq!==S.turnSeq){
    await beginTurn();
    if(prev&&prev.phase==='play'&&cur.msg)toast(fmtMsg(cur.msg)+turnTail());
    else if(isMyTurn())toast(IC('turn')+tr('yourTurn'));
  }else if(cur.msg&&cur.msg.k==='win'&&prev&&prev.phase==='play')toast(fmtMsg(cur.msg));
  render();
}
async function beginTurn(){
  const st=S.st;S.turnSeq=st.seq;S.sel=new Set();
  const stored=await getRack(S.me.id),have=new Set(stored);
  const ordered=S.rack.filter(id=>have.has(id)),seen=new Set(ordered);   /* 保留玩家自己排的順序 */
  stored.forEach(id=>{if(!seen.has(id))ordered.push(id)});
  S.rack=ordered;
  const tm=st.settings.timer;S.deadline=(tm&&st.phase==='play')?Date.now()+tm*1000:0;
  S.table=clone(st.table);S.startTable=clone(st.table);
  S.startRackArr=S.rack.slice();S.startRackSet=new Set(S.rack);
  if(isMyTurn()&&st.phase==='play')sfx('turn');
}
async function afterWrite(){

/* ====== 電腦玩家、逾時與玩家離開（房主執行）====== */
function hostDuties(){
  const st=S.st;if(!st||st.phase!=='play'||!S.host)return;
  const p=st.players[st.turn];
  if((p.bot||p.auto)&&!S.botBusy){
    S.botBusy=true;const seq=st.seq;
    setTimeout(async()=>{try{await botTurn(seq)}finally{S.botBusy=false}},1000+Math.random()*900);
  }else if(!p.bot&&!p.auto&&p.id!==S.me.id&&st.settings.timer&&S.deadline&&Date.now()>S.deadline+7000&&S.forcedSeq!==st.seq){
    S.forcedSeq=st.seq;forceSkip();
  }
}
async function botTurn(seq){
  const st=S.st;if(!st||st.seq!==seq||st.phase!=='play')return;
  const p=st.players[st.turn];if(!p.bot&&!p.auto)return;
  const rack=await getRack(p.id);
  const plan=planBot(st.table,rack,p.meld,st.settings.meld30,st.settings.diff||'normal');
  const ok=await finishTurn(p.id,plan.table,plan.played>0?plan.rack:rack,plan.played);
  if(ok){
    if(S.st.phase==='over'&&S.st.winner===p.id)botReact(p.id,'cute'===S.pref.theme?'😆':'👏');
    else if(plan.played>=5&&Math.random()<.5)botReact(p.id,'🔥');
    await afterWrite();
  }
}
function botReact(id,e){const o={n:Date.now()+Math.random(),id,e};Store.set(K('rx'),o);showReact(o)}
async function forceSkip(){
  const st=S.st;if(!st||st.phase!=='play')return;
  const p=st.players[st.turn];
  const rack=await getRack(p.id);
  const ok=await finishTurn(p.id,st.table,rack,0);
  if(ok)await afterWrite();
}
async function sumRack(pid){return (await getRack(pid)).reduce((a,id)=>a+tval(id),0)}
async function finishTurn(pid,table,rack,played){
  const cur=await Store.get(K('s'));
  if(!cur||cur.phase!=='play'||cur.seq!==S.st.seq||cur.players[cur.turn].id!==pid)return false;
  const st=cur,pl=st.players[st.turn];let msg,drawn=null;
  if(played>0){st.table=table;pl.meld=true;st.passes=0;msg={k:'play',id:pid,n:played}}
  else if(st.pool.length){drawn=st.pool.pop();rack=rack.concat(drawn);st.passes=0;msg={k:'draw',id:pid}}
  else{st.passes=(st.passes||0)+1;msg={k:'pass',id:pid}}
  pl.n=rack.length;
  if(!await setRack(pid,rack))return false;
  let winner=null;
  if(rack.length===0)winner=pid;
  else if(st.passes>=st.players.length)winner='lowest';
  if(winner){
    const sums={};let total=0;
    for(const p of st.players){sums[p.id]=await sumRack(p.id);total+=sums[p.id]}
    if(winner==='lowest')winner=st.players.slice().sort((a,b)=>sums[a.id]-sums[b.id])[0].id;
    st.scores=st.players.map(p=>({id:p.id,sum:sums[p.id],delta:p.id===winner?total-sums[winner]:-sums[p.id]}));
    st.phase='over';st.winner=winner;
    st.board=st.board||{};st.board[winner]=(st.board[winner]||0)+1;
    msg={k:'win',id:winner};
  }else{st.turn=(st.turn+1)%st.players.length;st.seq++}
  st.msg=msg;st.v++;
  if(!await Store.set(K('s'),st))return false;
  S.st=st;
  if(pid===S.me.id){if(drawn!==null)S.fresh=drawn;sfx(drawn!==null?'draw':played>0?'done':'ui')}
  return true;
}
/* 玩家離開：牌放回牌堆、輪次順延；只剩一人就直接結束 */
function handleLeave(pid){
  if(!S.host||!pid||!S.st)return;
  if(S.st.phase==='play')goAway(pid);
  else Store.del(K('j:'+pid));
}
/* 斷線或離開：座位交給電腦代打，人回來就接回（牌都還在） */
let awaying=Promise.resolve();
function goAway(pid){awaying=awaying.then(()=>setAuto(pid,true)).catch(()=>{});return awaying}
function goBack(pid){awaying=awaying.then(()=>setAuto(pid,false)).catch(()=>{});return awaying}
async function setAuto(pid,on){
  if(!S.host||!pid||pid===S.me.id)return;
  const cur=await Store.get(K('s'));
  if(!cur||cur.phase!=='play')return;
  const p=cur.players.find(x=>x.id===pid);if(!p||p.bot)return;
  if(on===!!p.auto)return;
  if(on)p.auto=true;else delete p.auto;
  cur.msg={k:on?'away':'back',name:pname(p)};cur.v++;
  if(!await Store.set(K('s'),cur))return;
  S.st=cur;await afterWrite();
}
let removing=Promise.resolve();
function removeFromGame(pid){removing=removing.then(()=>doRemove(pid)).catch(()=>{});return removing}
async function doRemove(pid){
  if(!S.host||pid===S.me.id)return;
  const cur=await Store.get(K('s'));
  if(!cur||cur.phase!=='play')return;
  const idx=cur.players.findIndex(p=>p.id===pid);if(idx<0)return;
  const gone=cur.players[idx],rk=await getRack(pid);
  cur.pool=shuffle(cur.pool.concat(rk));
  cur.players.splice(idx,1);
  await Store.del(K('r:'+pid));await Store.del(K('j:'+pid));
  const msg={k:'left',name:pname(gone)};
  if(cur.players.length<2){
    const w=cur.players[0];
    cur.phase='over';cur.winner=w?w.id:null;cur.endBy='left';cur.scores=[];
    cur.board=cur.board||{};if(w)cur.board[w.id]=(cur.board[w.id]||0)+1;
    cur.msg=msg;
  }else{
    if(idx<cur.turn)cur.turn--;
    else if(idx===cur.turn){cur.turn=cur.turn%cur.players.length;cur.seq++}
    cur.passes=0;cur.msg=msg;
  }
  cur.v++;
  if(!await Store.set(K('s'),cur))return;
  S.st=cur;
  await afterWrite();
}
